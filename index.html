const GRAMMAR = [{"id":"z5-01","lang":"zh","lv":5,"cat":"특수 구문","pat":"(주어)+所+동사+的+명사","ko":"~가 …하는 (바의)","note":"동사 앞에 붙어 그 동사의 대상을 가리켜요. 글말에서 많이 쓰고, 所를 빼도 뜻은 크게 바뀌지 않아요.","ex":"这正是我所担心的问题。","py":"zhè zhèngshì wǒ suǒ dānxīn de wèntí.","exko":"이게 바로 내가 걱정하던 문제예요.","q":"我___认识的他是一个很诚实的人。","o":["所","被","把","让"],"qko":"내가 아는 그는 아주 정직한 사람이에요."},{"id":"z5-02","lang":"zh","lv":5,"cat":"특수 구문","pat":"A+令+B+동사/형용사","ko":"A가 B를 ~하게 하다","note":"让·使와 같은 사역 표현으로, 감정이나 상태를 일으킬 때 주로 써요. 글말 느낌이 조금 더 강해요.","ex":"他的回答令老师很满意。","py":"tā de huídá lìng lǎoshī hěn mǎnyì.","exko":"그의 대답은 선생님을 매우 만족시켰어요.","q":"这个好消息___大家非常兴奋。","o":["令","把","被","对"],"qko":"이 좋은 소식은 모두를 아주 들뜨게 했어요."},{"id":"z5-03","lang":"zh","lv":5,"cat":"비교","pat":"A+不如+B(+형용사)","ko":"A는 B만 못하다","note":"B가 더 낫다는 뜻이에요. 뒤에 형용사가 오면 'A는 B만큼 ~하지 않다'가 돼요.","ex":"我的汉语水平不如他。","py":"wǒ de hànyǔ shuǐpíng bùrú tā.","exko":"내 중국어 실력은 그 사람만 못해요.","q":"坐公交车___骑自行车方便。","o":["不如","比较","而且","虽然"],"qko":"버스 타는 게 자전거 타는 것만큼 편하지 않아요."},{"id":"z5-04","lang":"zh","lv":5,"cat":"개사","pat":"동사+于+시간·장소","ko":"~에, ~에서 (글말)","note":"在·从과 비슷한 뜻을 글말로 나타내요. 建于, 位于, 生于처럼 동사 바로 뒤에 붙는 경우가 많아요.","ex":"这所大学位于城市的东边。","py":"zhèsuǒ dàxué wèiyú chéngshì de dōngbiān.","exko":"이 대학은 도시 동쪽에 있어요.","q":"这座寺庙建___明朝。","o":["于","从","给","向"],"qko":"이 절은 명나라 때 지어졌어요."},{"id":"z5-05","lang":"zh","lv":5,"cat":"개사","pat":"朝+방향/대상+동사","ko":"~을 향해","note":"몸이나 동작이 향하는 방향을 나타내요. 向과 비슷하지만 朝는 눈에 보이는 동작에 더 자주 써요.","ex":"窗户朝南，房间里很亮。","py":"chuānghù cháonán, fángjiān lǐ hěnliàng.","exko":"창문이 남향이라 방이 밝아요.","q":"他笑着___我走了过来。","o":["朝","把","被","让"],"qko":"그는 웃으면서 내 쪽으로 걸어왔어요."},{"id":"z5-06","lang":"zh","lv":5,"cat":"접속 구문","pat":"A、B以及C","ko":"그리고, 및","note":"명사나 구를 나열할 때 마지막 항목 앞에 써요. 和보다 격식 있는 말이에요.","ex":"参加会议的有经理、主任以及各部门的代表。","py":"cānjiā huìyì de yǒu jīnglǐ, zhǔrèn yǐjí gè bùmén de dàibiǎo.","exko":"회의에는 사장, 주임 및 각 부서 대표가 참석했어요.","q":"会议讨论了工资、休假___培训等问题。","o":["以及","并且","于是","而是"],"qko":"회의에서 임금, 휴가 및 교육 문제를 논의했어요."},{"id":"z5-07","lang":"zh","lv":5,"cat":"부사","pat":"(一/只要…)+便+동사","ko":"곧, 바로 (=就, 글말)","note":"앞의 일이 일어나자 곧 뒤의 일이 이어질 때 써요. 뜻은 就와 같고 글말에서 써요.","ex":"只要有时间，他便去图书馆看书。","py":"zhǐyào yǒu shíjiān, tā biàn qù túshūguǎn kànshū.","exko":"시간만 있으면 그는 바로 도서관에 가서 책을 봐요.","q":"他一到家___开始做饭。","o":["便","才","再","还"],"qko":"그는 집에 도착하자마자 밥을 하기 시작했어요."},{"id":"z5-08","lang":"zh","lv":5,"cat":"부사","pat":"始终+동사/형용사","ko":"처음부터 끝까지, 줄곧","note":"어떤 상태가 처음부터 끝까지 변하지 않았음을 강조해요. 一直와 달리 앞으로의 일에는 잘 쓰지 않아요.","ex":"比赛中他始终保持冷静。","py":"bǐsài zhōng tā shǐzhōng bǎochí lěngjìng.","exko":"경기 내내 그는 침착함을 유지했어요.","q":"他___没有告诉我事情的真相。","o":["始终","已经","马上","将要"],"qko":"그는 끝까지 나에게 사건의 진상을 말하지 않았어요."},{"id":"z5-09","lang":"zh","lv":5,"cat":"접속 구문","pat":"幸亏A，不然B","ko":"A해서 다행이지, 아니었으면 B","note":"좋은 조건 덕분에 나쁜 결과를 피했다는 뜻이에요. 不然 대신 要不然·否则도 써요.","ex":"幸亏带了伞，不然就被淋湿了。","py":"xìngkuī dài le sǎn, bùrán jiù bèi línshī le.","exko":"우산을 가져와서 다행이지, 안 그랬으면 비에 젖었을 거예요.","q":"___你提醒我，不然我就忘了。","o":["幸亏","尽管","即使","既然"],"qko":"네가 알려 줘서 다행이야, 안 그랬으면 잊어버렸을 거야."},{"id":"z5-10","lang":"zh","lv":5,"cat":"접속 구문","pat":"不但不/没A，反而B","ko":"A하기는커녕 오히려 B하다","note":"기대와 반대되는 결과가 나왔을 때 써요. 앞부분은 반드시 부정형이에요.","ex":"吃了药，他的病不但没好，反而更重了。","py":"chī le yào, tā de bìng búdàn méihǎo, fǎn'ér gèngzhòng le.","exko":"약을 먹었는데 그의 병은 낫기는커녕 오히려 더 심해졌어요.","q":"雨不但没停，___越下越大了。","o":["反而","因此","于是","所以"],"qko":"비가 그치기는커녕 오히려 점점 더 세게 내렸어요."},{"id":"z5-11","lang":"zh","lv":5,"cat":"접속 구문","pat":"宁可A，也不/也要B","ko":"차라리 A할지언정 B하지 않겠다","note":"손해를 감수하고 A를 고르는 마음을 나타내요. 也要가 오면 'A하더라도 B하겠다'가 돼요.","ex":"他宁可多花点钱，也要买质量好的。","py":"tā nìngkě duōhuādiǎn qián, yě yào mǎi zhìliàng hǎo de.","exko":"그는 돈을 좀 더 쓰더라도 품질 좋은 걸 사려고 해요.","q":"我___走路回家，也不坐他的车。","o":["宁可","如果","因为","只要"],"qko":"나는 차라리 걸어서 집에 갈지언정 그의 차는 타지 않겠어요."},{"id":"z5-12","lang":"zh","lv":5,"cat":"접속 구문","pat":"与其A，不如B","ko":"A하느니 차라리 B하는 게 낫다","note":"두 가지를 비교해서 B를 고를 때 써요. A가 덜 좋은 쪽이에요.","ex":"与其坐着等，不如自己去找。","py":"yǔqí zuò zhe děng, bùrú zìjǐ qù zhǎo.","exko":"앉아서 기다리느니 차라리 직접 찾으러 가는 게 나아요.","q":"与其在家发愁，___出去走走。","o":["不如","而且","因此","何况"],"qko":"집에서 걱정하느니 차라리 나가서 좀 걷는 게 나아요."},{"id":"z5-13","lang":"zh","lv":5,"cat":"접속 구문","pat":"万一A，(就)B","ko":"만일 A하면 B","note":"일어날 가능성이 낮은, 주로 좋지 않은 일을 가정해요.","ex":"多带点钱吧，万一不够就麻烦了。","py":"duōdài diǎn qián ba, wànyī búgòu jiù máfán le.","exko":"돈을 좀 넉넉히 챙겨, 혹시 모자라면 곤란하니까.","q":"___下雨，我们就改天再去。","o":["万一","虽然","尽管","不但"],"qko":"혹시 비가 오면 우리 다른 날 가자."},{"id":"z5-14","lang":"zh","lv":5,"cat":"접속 구문","pat":"除非A，不然/否则B","ko":"A하지 않는 한 B","note":"A가 유일한 조건이라는 뜻이에요. 뒤에는 그 조건이 없을 때의 결과가 와요.","ex":"除非你答应我的条件，否则我不会同意。","py":"chúfēi nǐ dāyìng wǒ de tiáojiàn, fǒuzé wǒ búhuì tóngyì.","exko":"네가 내 조건을 받아들이지 않는 한 나는 동의하지 않을 거야.","q":"___你亲自去请他，不然他不会来的。","o":["除非","既然","虽然","因为"],"qko":"네가 직접 가서 부탁하지 않는 한 그는 안 올 거야."},{"id":"z5-15","lang":"zh","lv":5,"cat":"접속 구문","pat":"哪怕A，也B","ko":"설령 A하더라도 B","note":"극단적인 경우를 가정해도 결과는 바뀌지 않는다는 뜻이에요. 即使와 비슷하고 말할 때 더 자주 써요.","ex":"哪怕只有一点希望，我们也不能放弃。","py":"nǎpà zhǐyǒu yìdiǎn xīwàng, wǒmen yě bùnéng fàngqì.","exko":"희망이 조금밖에 없더라도 포기하면 안 돼요.","q":"___再忙，他也每天给父母打电话。","o":["哪怕","因为","既然","只有"],"qko":"아무리 바빠도 그는 매일 부모님께 전화해요."},{"id":"z5-16","lang":"zh","lv":5,"cat":"특수 구문","pat":"A+为+B+所+동사","ko":"A가 B에 의해 ~되다 (글말 피동)","note":"被자 피동문과 뜻이 같고, 글말에서 써요. 为 뒤에는 행동하는 쪽이 와요.","ex":"这个道理已经为大多数人所接受。","py":"zhège dàolǐ yǐjīng wéi dàduōshù rén suǒ jiēshòu.","exko":"이 이치는 이미 대다수 사람들에게 받아들여졌어요.","q":"他的作品深受读者喜爱，为很多人___熟悉。","o":["所","被","把","给"],"qko":"그의 작품은 독자들의 사랑을 받아 많은 사람에게 잘 알려져 있어요."},{"id":"z5-17","lang":"zh","lv":5,"cat":"접속 구문","pat":"一旦A，就B","ko":"일단 A하면 B","note":"어떤 일이 생기기만 하면 바로 결과가 따른다는 뜻이에요. 주로 앞으로의 일이나 가정에 써요.","ex":"一旦养成了习惯，就很难改变。","py":"yídàn yǎngchéng le xíguàn, jiù hěn nán gǎibiàn.","exko":"일단 습관이 들면 바꾸기 어려워요.","q":"___失去这次机会，就很难再找回来。","o":["一旦","虽然","尽管","不但"],"qko":"일단 이번 기회를 놓치면 다시 찾기 어려워요."},{"id":"z5-18","lang":"zh","lv":5,"cat":"접속 구문","pat":"即使A，也B","ko":"설령 A하더라도 B","note":"가정한 상황에서도 결과가 같다는 뜻이에요. 哪怕보다 조금 격식 있는 말이에요.","ex":"即使你不说，我也知道。","py":"jíshǐ nǐ bù shuō, wǒ yě zhīdào.","exko":"네가 말하지 않아도 나는 알아.","q":"___明天下大雪，比赛也照常进行。","o":["即使","因为","既然","只要"],"qko":"내일 눈이 많이 오더라도 경기는 예정대로 진행돼요."},{"id":"z5-19","lang":"zh","lv":5,"cat":"접속 구문","pat":"无论/不管+의문 표현，都B","ko":"~이든 상관없이 다 B","note":"无论 뒤에는 什么·谁·怎么나 'A还是B' 같은 선택 표현이 와요.","ex":"无论刮风还是下雨，他都坚持跑步。","py":"wúlùn guāfēng háishì xiàyǔ, tā dōu jiānchí pǎobù.","exko":"바람이 불든 비가 오든 그는 꾸준히 달리기를 해요.","q":"___遇到什么困难，他都不放弃。","o":["无论","虽然","因为","既然"],"qko":"어떤 어려움을 만나도 그는 포기하지 않아요."},{"id":"z5-20","lang":"zh","lv":5,"cat":"접속 구문","pat":"之所以A，是因为B","ko":"A한 까닭은 B 때문이다","note":"결과를 먼저 말하고 이유를 뒤에서 밝혀요. 이유를 강조하고 싶을 때 써요.","ex":"他之所以成功，是因为他从不放弃。","py":"tā zhīsuǒyǐ chénggōng, shìyīnwèi tā cóngbú fàngqì.","exko":"그가 성공한 까닭은 절대 포기하지 않았기 때문이에요.","q":"我___选择这份工作，是因为它很有挑战性。","o":["之所以","既然","虽然","尽管"],"qko":"내가 이 일을 고른 까닭은 도전할 만하기 때문이에요."},{"id":"z5-21","lang":"zh","lv":5,"cat":"고정 표현","pat":"以A为B","ko":"A를 B로 삼다","note":"A를 기준·목표·중심으로 한다는 뜻이에요. 以……为主, 以……为目标처럼 자주 써요.","ex":"这家餐厅以海鲜为主。","py":"zhèjiā cāntīng yǐ hǎixiān wéizhǔ.","exko":"이 식당은 해산물이 주메뉴예요.","q":"这家公司以客户满意___目标。","o":["为","被","把","让"],"qko":"이 회사는 고객 만족을 목표로 삼아요."},{"id":"z5-22","lang":"zh","lv":5,"cat":"부사","pat":"(原来A，)难怪B","ko":"어쩐지 B하더라","note":"이유를 알고 나서 이상하게 여기던 일이 이해될 때 써요. 怪不得와 같은 뜻이에요.","ex":"原来他是北京人，难怪普通话说得这么好。","py":"yuánlái tā shì Běijīng rén, nánguài pǔtōnghuà shuō de zhème hǎo.","exko":"알고 보니 베이징 사람이었구나, 어쩐지 표준어를 잘하더라.","q":"原来他生病了，___今天没来上课。","o":["难怪","难道","何必","究竟"],"qko":"알고 보니 그가 아팠구나, 어쩐지 오늘 수업에 안 오더라."},{"id":"z5-23","lang":"zh","lv":5,"cat":"부사","pat":"难道A吗？","ko":"설마 A란 말인가?","note":"반문으로 강조하는 말이에요. 겉은 질문이지만 실제로는 반대 뜻을 주장해요.","ex":"难道你连这么简单的题都不会吗？","py":"nándào nǐ lián zhème jiǎndān de tí dōu búhuì ma?","exko":"설마 이렇게 쉬운 문제도 못 푸는 거야?","q":"___你不知道今天放假吗？","o":["难道","难怪","到底","不然"],"qko":"설마 오늘 쉬는 날인 걸 몰랐어?"},{"id":"z5-24","lang":"zh","lv":5,"cat":"부사","pat":"何必+동사(+呢)","ko":"구태여 ~할 필요가 있나","note":"그럴 필요가 없다는 뜻을 반문으로 나타내요. 끝에 呢를 자주 붙여요.","ex":"大家都是朋友，何必这么客气呢？","py":"dàjiā dōu shì péngyǒu, hébì zhème kèqì ne?","exko":"다 친구끼리인데 뭘 그렇게 예의를 차려요?","q":"这点小事，你___这么生气呢？","o":["何必","难怪","未必","必须"],"qko":"이런 작은 일로 뭘 그렇게 화를 내요?"},{"id":"z5-25","lang":"zh","lv":5,"cat":"부사","pat":"毕竟+A","ko":"어쨌든, 결국 (A이니까)","note":"사실이나 이유를 다시 짚어서 결론을 뒷받침해요. 상대를 이해해 주자는 말에 자주 써요.","ex":"他毕竟刚来，很多情况还不了解。","py":"tā bìjìng gāng lái, hěnduō qíngkuàng hái bù liǎojiě.","exko":"그는 어쨌든 막 왔으니까 모르는 게 많아요.","q":"别怪他了，他___还是个孩子。","o":["毕竟","难道","何必","从而"],"qko":"그를 탓하지 마, 그래도 아직 아이잖아."},{"id":"z5-26","lang":"zh","lv":5,"cat":"부사","pat":"居然/竟然+동사","ko":"뜻밖에도, 놀랍게도","note":"예상과 다른 일이 일어나 놀랐다는 느낌을 담아요. 竟然과 바꿔 쓸 수 있어요.","ex":"我没想到他居然忘了自己的生日。","py":"wǒ méixiǎngdào tā jūrán wàng le zìjǐ de shēngrì.","exko":"그가 자기 생일을 잊어버릴 줄은 몰랐어요.","q":"这么难的题，他___五分钟就做完了。","o":["居然","毕竟","何必","难怪"],"qko":"이렇게 어려운 문제를 그는 놀랍게도 5분 만에 다 풀었어요."},{"id":"z5-27","lang":"zh","lv":5,"cat":"부사","pat":"总算+동사","ko":"마침내, 겨우","note":"오래 기다리거나 애쓴 끝에 바라던 일이 이루어졌을 때 써요.","ex":"经过几次修改，论文总算完成了。","py":"jīngguò jǐcì xiūgǎi, lùnwén zǒngsuàn wánchéng le.","exko":"몇 번 고친 끝에 논문이 마침내 완성됐어요.","q":"等了一个小时，公交车___来了。","o":["总算","曾经","从来","难道"],"qko":"한 시간을 기다려서 버스가 마침내 왔어요."},{"id":"z5-28","lang":"zh","lv":5,"cat":"부사","pat":"未必+동사/형용사","ko":"반드시 ~한 것은 아니다","note":"不一定과 같은 뜻으로, 말투를 조금 부드럽게 해요.","ex":"他说的话未必都是真的。","py":"tā shuō de huà wèibì dōu shì zhēnde.","exko":"그가 한 말이 다 사실인 건 아닐 수도 있어요.","q":"贵的东西___就好。","o":["未必","必须","何必","务必"],"qko":"비싼 물건이 꼭 좋은 건 아니에요."},{"id":"z5-29","lang":"zh","lv":5,"cat":"고정 표현","pat":"动不动就+동사","ko":"걸핏하면 ~하다","note":"작은 일에도 쉽게 어떤 반응을 보인다는 뜻으로, 주로 못마땅할 때 써요.","ex":"这孩子身体不好，动不动就感冒。","py":"zhè háizi shēntǐ bùhǎo, dòngbudòng jiù gǎnmào.","exko":"이 아이는 몸이 약해서 걸핏하면 감기에 걸려요.","q":"他脾气不好，___就发火。","o":["动不动","不得不","怪不得","了不起"],"qko":"그는 성격이 나빠서 걸핏하면 화를 내요."},{"id":"z5-30","lang":"zh","lv":5,"cat":"고정 표현","pat":"对(于)A来说","ko":"A에게 있어서","note":"어떤 사람이나 입장에서 판단할 때 써요. 在A看来와 비슷해요.","ex":"对留学生来说，最难的是适应新环境。","py":"duì liúxuéshēng láishuō, zuìnán de shì shìyìng xīn huánjìng.","exko":"유학생에게 가장 어려운 건 새 환경에 적응하는 거예요.","q":"对我___，健康比钱更重要。","o":["来说","看来","以来","起来"],"qko":"나에게는 건강이 돈보다 더 중요해요."},{"id":"z5-31","lang":"zh","lv":5,"cat":"고정 표현","pat":"在A(的)+명사+下","ko":"A의 ~ 아래, ~ 덕분에","note":"도움·지도·영향 같은 조건을 나타내요. 帮助, 指导, 影响 같은 말과 자주 써요.","ex":"在大家的支持下，活动办得很成功。","py":"zài dàjiā de zhīchí xià, huódòng bànde hěn chénggōng.","exko":"모두의 지지 덕분에 행사가 성공적으로 치러졌어요.","q":"在老师的帮助___，他的成绩提高了很多。","o":["下","后","前","外"],"qko":"선생님의 도움으로 그의 성적이 많이 올랐어요."},{"id":"z5-32","lang":"zh","lv":5,"cat":"고정 표현","pat":"不得不+동사","ko":"어쩔 수 없이 ~하다","note":"원하지 않지만 상황 때문에 해야 할 때 써요.","ex":"飞机晚点了，我们不得不改变计划。","py":"fēijī wǎndiǎn le, wǒmen bùdébù gǎibiàn jìhuà.","exko":"비행기가 연착돼서 어쩔 수 없이 계획을 바꿨어요.","q":"因为下大雨，比赛___推迟。","o":["不得不","怪不得","了不起","舍不得"],"qko":"비가 많이 와서 경기는 어쩔 수 없이 미뤄졌어요."},{"id":"z6-01","lang":"zh","lv":6,"cat":"대명사·양사","pat":"本人","ko":"본인 (나, 또는 그 사람 자신)","note":"공식적인 자리에서 '나'를 가리키거나, 앞에 나온 사람 자신을 가리켜요.","ex":"这件事必须由本人亲自办理。","py":"zhèjiàn shì bìxū yóu běnrén qīnzì bànlǐ.","exko":"이 일은 반드시 본인이 직접 처리해야 해요.","q":"___对这件事不负任何责任。","o":["本人","本来","本领","根本"],"qko":"본인은 이 일에 대해 어떤 책임도 지지 않습니다."},{"id":"z6-02","lang":"zh","lv":6,"cat":"대명사·양사","pat":"명사+本身","ko":"그 자체","note":"사람이나 사물 자체를 강조해요. 주변 조건과 구별할 때 자주 써요.","ex":"工作本身并不难，难的是和人打交道。","py":"gōngzuò běnshēn bìng bùnán, nán de shì hé rén dǎjiāodao.","exko":"일 자체는 어렵지 않고, 어려운 건 사람을 상대하는 거예요.","q":"问题___并不复杂，复杂的是人际关系。","o":["本身","本人","大家","彼此"],"qko":"문제 자체는 복잡하지 않고, 복잡한 건 인간관계예요."},{"id":"z6-03","lang":"zh","lv":6,"cat":"대명사·양사","pat":"一番+동사/명사","ko":"한바탕, 한차례","note":"시간과 힘이 드는 행동에 붙는 양사예요. 수사는 주로 一를 써요.","ex":"他把房间仔细地打扫了一番。","py":"tā bǎ fángjiān zǐxì de dǎsǎo le yìfān.","exko":"그는 방을 꼼꼼히 한바탕 청소했어요.","q":"经过一___努力，他终于考上了研究生。","o":["番","顿","趟","遍"],"qko":"한바탕 노력한 끝에 그는 마침내 대학원에 합격했어요."},{"id":"z6-04","lang":"zh","lv":6,"cat":"특수 구문","pat":"이합사 사이에 수량·了·过 넣기","ko":"见面·帮忙처럼 떼어 쓰는 동사","note":"동사+목적어로 된 이합사는 목적어를 뒤에 바로 붙이지 못하고, 수량이나 了·过를 가운데 넣어요.","ex":"我们见过一次面。","py":"wǒmen jiànguo yícì miàn.","exko":"우리는 한 번 만난 적이 있어요.","q":"上次他帮了我一个大___。","o":["忙","帮","助","手"],"qko":"지난번에 그가 나를 크게 도와줬어요."},{"id":"z6-05","lang":"zh","lv":6,"cat":"고정 표현","pat":"巴不得+동사","ko":"간절히 바라다, ~하지 못해 안달이다","note":"몹시 바라는 마음을 나타내요. 말할 때 자주 써요.","ex":"孩子们巴不得马上放暑假。","py":"háizi men bābùdé mǎshàng fàngshǔjià.","exko":"아이들은 당장 여름 방학이 되기만을 간절히 바라요.","q":"听说可以提前下班，大家都___马上走。","o":["巴不得","怪不得","了不起","对不起"],"qko":"일찍 퇴근해도 된다는 말에 모두 당장 가고 싶어 안달이에요."},{"id":"z6-06","lang":"zh","lv":6,"cat":"개사","pat":"형용사+于+비교 대상","ko":"~보다 (글말 비교)","note":"高于, 低于, 大于처럼 형용사 뒤에 于를 붙여 비교를 나타내요. 比 구문의 글말 표현이에요.","ex":"今年的销售额明显高于去年。","py":"jīnnián de xiāoshòu'é míngxiǎn gāoyú qùnián.","exko":"올해 매출은 작년보다 확실히 높아요.","q":"这个城市的人口多___北京。","o":["于","比","从","对"],"qko":"이 도시 인구는 베이징보다 많아요."},{"id":"z6-07","lang":"zh","lv":6,"cat":"개사","pat":"本着+원칙·정신","ko":"~에 입각하여","note":"원칙·정신·태도 같은 추상 명사와 함께 쓰는 글말이에요.","ex":"我们应该本着实事求是的态度解决问题。","py":"wǒmen yīnggāi běnzhe shíshìqiúshì de tàidù jiějué wèntí.","exko":"우리는 사실에 근거한 태도로 문제를 해결해야 해요.","q":"双方___互相尊重的原则进行合作。","o":["本着","沿着","对着","随着"],"qko":"양측은 서로 존중하는 원칙에 따라 협력해요."},{"id":"z6-08","lang":"zh","lv":6,"cat":"특수 구문","pat":"A+把+B+동사+得/个+결과","ko":"A 때문에 B가 ~하게 되다","note":"把 뒤의 사람이 어떤 상태가 되게 만들었다는 뜻이에요. 동사 뒤에는 결과를 나타내는 말이 꼭 와요.","ex":"这几天的加班把我累坏了。","py":"zhè jǐtiān de jiābān bǎ wǒ lèihuài le.","exko":"요 며칠 야근 때문에 완전히 지쳤어요.","q":"这件事___他气得一夜没睡。","o":["把","被","对","向"],"qko":"이 일 때문에 그는 화가 나서 밤새 잠을 못 잤어요."},{"id":"z6-09","lang":"zh","lv":6,"cat":"고정 표현","pat":"总而言之 / 众所周知 / 归根到底","ko":"요컨대 / 모두 알다시피 / 결국 따져 보면","note":"문장 앞이나 중간에 끼어들어 말하는 사람의 정리나 태도를 보여 줘요. 쉼표로 떼어 써요.","ex":"众所周知，吸烟对健康有害。","py":"zhòngsuǒzhōuzhī, xīyān duì jiànkāng yǒuhài.","exko":"모두 알다시피 흡연은 건강에 해로워요.","q":"有人喜欢早起，有人喜欢熬夜，___，每个人的习惯都不一样。","o":["总而言之","与其","何况","尽管"],"qko":"일찍 일어나는 걸 좋아하는 사람도, 밤새는 걸 좋아하는 사람도 있어요. 요컨대 사람마다 습관이 달라요."},{"id":"z6-10","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，以至B","ko":"A해서 (결국) B할 정도가 되다","note":"앞의 정도가 심해서 뒤의 결과까지 이르렀다는 뜻이에요.","ex":"他看书看得太入迷，以至连饭都忘了吃。","py":"tā kànshū kànde tài rùmí, yǐzhì liánfàn dōu wàng le chī.","exko":"그는 책에 너무 빠져서 밥 먹는 것도 잊을 정도였어요.","q":"他工作太投入了，___忘了时间。","o":["以至","以便","以免","何况"],"qko":"그는 일에 너무 몰두해서 시간 가는 줄도 몰랐어요."},{"id":"z6-11","lang":"zh","lv":6,"cat":"접속 구문","pat":"(由于)A，以致B","ko":"A로 인해 (나쁜 결과) B가 되다","note":"以至와 비슷하지만 以致 뒤에는 주로 좋지 않은 결과가 와요.","ex":"他平时不注意休息，以致身体越来越差。","py":"tā píngshí bú zhùyì xiūxī, yǐzhì shēntǐ yuèláiyuè chà.","exko":"그는 평소 쉬는 데 신경 쓰지 않아서 몸이 점점 나빠졌어요.","q":"由于没有认真检查，___出现了严重的错误。","o":["以致","以便","况且","何况"],"qko":"꼼꼼히 확인하지 않아서 심각한 실수가 생겼어요."},{"id":"z6-12","lang":"zh","lv":6,"cat":"고정 표현","pat":"不过/只是A而已/罢了","ko":"A일 뿐이다","note":"정도나 범위를 작게 말해서 '그 정도일 뿐'이라는 뜻을 나타내요. 앞에 不过·只是를 자주 함께 써요.","ex":"我不过开个玩笑罢了，你别当真。","py":"wǒ búguò kāigè wánxiào bàle, nǐ biédàngzhēn.","exko":"그냥 농담한 것뿐이니 진지하게 받아들이지 마.","q":"我只是随便问问___，你别紧张。","o":["而已","似的","的话","起来"],"qko":"그냥 물어본 것뿐이니 긴장하지 마."},{"id":"z6-13","lang":"zh","lv":6,"cat":"접속 구문","pat":"A固然……，但是B","ko":"A는 물론 ~하지만 B","note":"앞의 사실을 인정하면서 뒤에서 다른 점을 말해요.","ex":"钱固然重要，但是健康更重要。","py":"qián gùrán zhòngyào, dànshì jiànkāng gèng zhòngyào.","exko":"돈이 물론 중요하지만 건강이 더 중요해요.","q":"这个办法___好，但是成本太高。","o":["固然","既然","与其","宁可"],"qko":"이 방법이 물론 좋긴 하지만 비용이 너무 많이 들어요."},{"id":"z6-14","lang":"zh","lv":6,"cat":"접속 구문","pat":"时而A，时而B","ko":"때로는 A하고 때로는 B하다","note":"두 가지 상태가 번갈아 나타날 때 써요. 글말에서 자주 써요.","ex":"她的心情时而好，时而坏。","py":"tā de xīnqíng shí'ér hǎo, shí'ér huài.","exko":"그녀의 기분은 좋았다 나빴다 해요.","q":"这几天天气很怪，___晴，时而阴。","o":["时而","随时","及时","同时"],"qko":"요 며칠 날씨가 이상해서 맑았다 흐렸다 해요."},{"id":"z6-15","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，进而B","ko":"A하고 나아가 B하다","note":"앞의 일을 바탕으로 한 단계 더 나아갈 때 써요.","ex":"我们要先了解客户的需求，进而提供更好的服务。","py":"wǒmen yào xiān liǎojiě kèhù de xūqiú, jìn'ér tígōng gènghǎo de fúwù.","exko":"먼저 고객의 요구를 파악하고, 나아가 더 나은 서비스를 제공해야 해요.","q":"他先在国内读完硕士，___去国外攻读博士。","o":["进而","反而","然而","况且"],"qko":"그는 먼저 국내에서 석사를 마치고, 나아가 외국에서 박사 과정을 밟았어요."},{"id":"z6-16","lang":"zh","lv":6,"cat":"접속 구문","pat":"宁愿/宁肯A，也不B","ko":"차라리 A할지언정 B하지 않다","note":"宁可와 같은 뜻이에요. 손해를 감수하는 쪽을 고르는 마음을 나타내요.","ex":"她宁愿自己辛苦一点，也不愿意麻烦别人。","py":"tā nìngyuàn zìjǐ xīnkǔ yìdiǎn, yě bú yuànyì máfán biérén.","exko":"그녀는 차라리 자기가 좀 고생할지언정 남에게 폐를 끼치려 하지 않아요.","q":"他___饿着肚子，也不吃别人剩下的东西。","o":["宁愿","假如","尽管","只要"],"qko":"그는 차라리 굶을지언정 남이 남긴 음식은 먹지 않아요."},{"id":"z6-17","lang":"zh","lv":6,"cat":"접속 구문","pat":"倘若A，(就)B","ko":"만약 A라면 B","note":"如果와 같은 뜻의 글말이에요.","ex":"倘若有什么问题，请随时联系我。","py":"tǎngruò yǒu shénme wèntí, qǐng suíshí liánxì wǒ.","exko":"만약 문제가 있으면 언제든 연락 주세요.","q":"___明天天气好，我们就去爬山。","o":["倘若","尽管","无论","固然"],"qko":"만약 내일 날씨가 좋으면 등산 가요."},{"id":"z6-18","lang":"zh","lv":6,"cat":"접속 구문","pat":"愈A愈B","ko":"A할수록 B하다","note":"越……越……와 같은 뜻의 글말이에요.","ex":"问题愈复杂，愈需要冷静思考。","py":"wèntí yù fùzá, yù xūyào lěngjìng sīkǎo.","exko":"문제가 복잡할수록 더 침착하게 생각해야 해요.","q":"雨愈下___大，我们只好回去了。","o":["愈","很","太","最"],"qko":"비가 점점 더 세게 와서 우리는 돌아갈 수밖에 없었어요."},{"id":"z6-19","lang":"zh","lv":6,"cat":"특수 구문","pat":"要+동사+就+동사+个+보어","ko":"~하려면 제대로 ~하다","note":"할 거면 끝까지 충분히 하자는 뜻이에요. 个 뒤에 痛快, 够, 明白 같은 말이 와요.","ex":"要问就问个明白。","py":"yào wèn jiù wèngè míngbái.","exko":"물어볼 거면 확실히 물어봐.","q":"难得放假，要玩就玩___痛快。","o":["个","着","过","地"],"qko":"모처럼 쉬는 날이니 놀 거면 신나게 놀자."},{"id":"z6-20","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，况且B","ko":"게다가 B","note":"이유를 하나 더 보탤 때 써요. 앞의 이유를 더 단단하게 해요.","ex":"时间太晚了，况且外面还在下雨，你就别走了。","py":"shíjiān tàiwǎn le, kuàngqiě wàimiàn hái zài xiàyǔ, nǐ jiù bié zǒu le.","exko":"시간도 너무 늦었고 게다가 밖에 비도 오니까 가지 마.","q":"这件衣服太贵了，___颜色我也不喜欢。","o":["况且","然而","以致","从而"],"qko":"이 옷은 너무 비싸고, 게다가 색깔도 마음에 안 들어요."},{"id":"z6-21","lang":"zh","lv":6,"cat":"접속 구문","pat":"A尚且B，何况C","ko":"A도 B한데 하물며 C는","note":"더 쉬운 경우를 먼저 말하고, 더 어려운 경우는 말할 것도 없다는 뜻이에요.","ex":"专家尚且解决不了，何况我们呢？","py":"zhuānjiā shàngqiě jiějuébùliǎo, hékuàng wǒmen ne?","exko":"전문가도 해결 못 하는데 하물며 우리는 어떻겠어요?","q":"大人尚且搬不动，___孩子呢？","o":["何况","难怪","何必","未必"],"qko":"어른도 못 옮기는데 하물며 아이는 어떻겠어요?"},{"id":"z6-22","lang":"zh","lv":6,"cat":"접속 구문","pat":"即便/就算A，也B","ko":"설령 A하더라도 B","note":"即使와 같은 뜻이에요. 就算은 말할 때, 即便은 글말에서 더 자주 써요.","ex":"即便遇到困难，我们也要按时完成任务。","py":"jíbiàn yùdào kùnnán, wǒmen yě yào ànshí wánchéng rènwù.","exko":"어려움이 있더라도 제때 임무를 끝내야 해요.","q":"___失败了，我也不后悔。","o":["就算","既然","因为","只要"],"qko":"설령 실패하더라도 나는 후회하지 않아요."},{"id":"z6-23","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，以便B","ko":"B하기 쉽도록 A하다","note":"뒤 문장이 앞 행동의 목적이에요. 바라는 일이 쉽게 이루어지게 한다는 뜻이에요.","ex":"请把资料提前发给我，以便我做好准备。","py":"qǐng bǎ zīliào tíqián fāgěi wǒ, yǐbiàn wǒ zuòhǎo zhǔnbèi.","exko":"준비할 수 있게 자료를 미리 보내 주세요.","q":"请留下电话号码，___我们及时联系您。","o":["以便","以致","以至","况且"],"qko":"바로 연락드릴 수 있게 전화번호를 남겨 주세요."},{"id":"z6-24","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，以免B","ko":"B하지 않도록 A하다","note":"좋지 않은 일 B를 피하려는 목적을 나타내요.","ex":"开车时不要打电话，以免发生事故。","py":"kāichē shí búyào dǎdiànhuà, yǐmiǎn fāshēng shìgù.","exko":"사고가 나지 않도록 운전 중에는 전화하지 마세요.","q":"出门前检查一下门窗，___发生意外。","o":["以免","以便","进而","况且"],"qko":"사고가 나지 않도록 나가기 전에 문과 창문을 확인하세요."},{"id":"z6-25","lang":"zh","lv":6,"cat":"접속 구문","pat":"A，免得B","ko":"B하지 않게 A하다","note":"以免과 같은 뜻으로, 말할 때 더 자주 써요.","ex":"你到了给我打个电话，免得我担心。","py":"nǐ dào le gěi wǒ dǎgè diànhuà, miǎnde wǒ dānxīn.","exko":"내가 걱정하지 않게 도착하면 전화 줘.","q":"你早点出发，___路上堵车迟到。","o":["免得","何况","难怪","进而"],"qko":"길이 막혀 늦지 않게 일찍 출발해."},{"id":"z6-26","lang":"zh","lv":6,"cat":"부사","pat":"不至于+동사","ko":"~할 정도는 아니다","note":"어떤 정도까지 가지는 않을 거라고 판단할 때 써요.","ex":"这点小病，不至于住院吧。","py":"zhèdiǎn xiǎobìng, búzhìyú zhùyuàn ba.","exko":"이 정도 병이면 입원할 정도는 아니겠지.","q":"他虽然粗心，但还___忘了这么重要的事。","o":["不至于","不得不","对不起","来不及"],"qko":"그가 덤벙대긴 해도 이렇게 중요한 일을 잊을 정도는 아니에요."},{"id":"z6-27","lang":"zh","lv":6,"cat":"부사","pat":"未免+太/有点儿+형용사","ko":"아무래도 좀 ~하다","note":"지나치다고 부드럽게 평가할 때 써요. 뒤에 太·有点儿·过于가 자주 와요.","ex":"为这点小事吵架，未免太不值得了。","py":"wèi zhèdiǎn xiǎoshì chǎojià, wèimiǎn tài bù zhíde le.","exko":"이런 작은 일로 싸우는 건 아무래도 너무 아까워요.","q":"你这样说___太过分了。","o":["未免","何必","难道","况且"],"qko":"그렇게 말하는 건 아무래도 너무 지나쳐요."},{"id":"z6-28","lang":"zh","lv":6,"cat":"부사","pat":"难免+동사","ko":"~하기 마련이다","note":"어떤 일이 일어나는 것을 피하기 어렵다는 뜻이에요. 뒤에 会를 자주 붙여요.","ex":"刚开始工作，难免会遇到一些问题。","py":"gāng kāishǐ gōngzuò, nánmiǎn huì yùdào yìxiē wèntí.","exko":"처음 일을 시작하면 몇 가지 문제를 겪기 마련이에요.","q":"第一次做这种工作，___会出错。","o":["难免","何必","未免","毕竟"],"qko":"이런 일을 처음 하면 실수하기 마련이에요."},{"id":"z6-29","lang":"zh","lv":6,"cat":"부사","pat":"不妨+동사","ko":"~해 보는 것도 좋다","note":"상대에게 부드럽게 제안할 때 써요.","ex":"如果你有兴趣，不妨来参加我们的活动。","py":"rúguǒ nǐ yǒu xìngqù, bùfáng lái cānjiā wǒmen de huódòng.","exko":"관심 있으면 우리 행사에 와 보는 것도 좋아요.","q":"这个方法很有效，你___试一试。","o":["不妨","不免","不料","不止"],"qko":"이 방법이 효과가 좋으니 한번 해 봐도 괜찮아요."},{"id":"z6-30","lang":"zh","lv":6,"cat":"부사","pat":"简直+동사/형용사","ko":"그야말로, 정말","note":"과장하거나 강조할 때 써요. 거의 그 정도에 가깝다는 느낌이에요.","ex":"这里的风景简直像一幅画。","py":"zhèlǐ de fēngjǐng jiǎnzhí xiàng yì fú huà.","exko":"이곳 경치는 그야말로 한 폭의 그림 같아요.","q":"他画得太像了，___跟照片一模一样。","o":["简直","毕竟","何必","从而"],"qko":"그는 너무 똑같이 그려서 그야말로 사진과 똑같아요."},{"id":"z6-31","lang":"zh","lv":6,"cat":"고정 표현","pat":"就/对A而言","ko":"A에 관해 말하자면","note":"어떤 측면이나 입장에 한정해서 말할 때 써요. 글말 표현이에요.","ex":"就目前的情况而言，这个计划很难实现。","py":"jiù mùqián de qíngkuàng éryán, zhège jìhuà hěnnán shíxiàn.","exko":"현재 상황으로 보면 이 계획은 실현하기 어려워요.","q":"就质量___，这款手机是最好的。","o":["而言","而已","罢了","似的"],"qko":"품질로 말하자면 이 휴대폰이 가장 좋아요."},{"id":"z6-32","lang":"zh","lv":6,"cat":"고정 표현","pat":"非A不可","ko":"꼭 A해야만 한다","note":"반드시 그래야 한다는 강한 뜻이에요. 非 뒤에는 동사나 사람이 와요.","ex":"这件事非你亲自去不可。","py":"zhèjiàn shì fēi nǐ qīnzì qù bùkě.","exko":"이 일은 꼭 네가 직접 가야 해.","q":"这部电影太精彩了，我非看___。","o":["不可","不过","不如","不然"],"qko":"이 영화가 너무 재밌다니 꼭 봐야겠어요."},{"id":"t-01","lang":"en","lv":0,"cat":"품사 자리","pat":"관사/소유격/전치사 + 명사","ko":"명사가 들어갈 자리","note":"a·the·소유격 뒤나 전치사 뒤 빈칸에는 명사가 와요. 형용사가 앞에 있으면 그 뒤에 명사가 와요.","ex":"We appreciate your participation in the survey.","exko":"설문에 참여해 주셔서 감사합니다.","q":"The ___ of the new office will take about three months.","o":["construction","construct","constructive","constructed"],"qko":"새 사무실 공사는 약 세 달이 걸릴 거예요."},{"id":"t-02","lang":"en","lv":0,"cat":"품사 자리","pat":"형용사 + 명사 / be·remain + 형용사","ko":"형용사가 들어갈 자리","note":"명사 앞이나 be·become·remain 같은 동사 뒤에는 형용사가 와요.","ex":"The hotel offers a convenient shuttle service.","exko":"그 호텔은 편리한 셔틀 서비스를 제공해요.","q":"All employees must remain ___ during the inspection.","o":["available","availability","avail","availabilities"],"qko":"점검 동안 모든 직원은 연락이 닿는 상태로 있어야 해요."},{"id":"t-03","lang":"en","lv":0,"cat":"품사 자리","pat":"동사 + 부사 / be + 부사 + p.p.","ko":"부사가 들어갈 자리","note":"동사, 형용사, 분사를 꾸미는 자리에는 부사가 와요. be동사와 p.p. 사이 빈칸도 부사 자리예요.","ex":"The package was carefully wrapped.","exko":"소포는 조심스럽게 포장되어 있었어요.","q":"The sales figures increased ___ last quarter.","o":["significantly","significant","significance","signify"],"qko":"지난 분기에 매출이 크게 늘었어요."},{"id":"t-04","lang":"en","lv":0,"cat":"동사","pat":"단수 주어 + 단수 동사","ko":"주어와 동사의 수 일치","note":"주어 뒤에 전치사구나 관계사절이 길게 붙어도 동사는 맨 앞 명사에 맞춰요.","ex":"The list of participants is posted on the board.","exko":"참가자 명단이 게시판에 붙어 있어요.","q":"The price of the tickets ___ expected to rise next month.","o":["is","are","have","were"],"qko":"표 가격이 다음 달에 오를 것으로 예상돼요."},{"id":"t-05","lang":"en","lv":0,"cat":"동사","pat":"yesterday / last ~ / ~ ago + 과거","ko":"과거 시제","note":"yesterday, last week, ago처럼 지난 시점이 분명하면 과거 시제를 써요.","ex":"Ms. Lee joined the company two years ago.","exko":"이 씨는 2년 전에 회사에 들어왔어요.","q":"The board members ___ the proposal at last week's meeting.","o":["approved","approve","will approve","have approved"],"qko":"이사들은 지난주 회의에서 그 제안을 승인했어요."},{"id":"t-06","lang":"en","lv":0,"cat":"동사","pat":"have/has + p.p. (since, for, recently)","ko":"현재완료","note":"과거부터 지금까지 이어진 일이나 경험에 써요. since, for ~, recently, so far와 자주 함께 나와요.","ex":"Our sales have grown steadily since 2020.","exko":"우리 매출은 2020년부터 꾸준히 늘었어요.","q":"Mr. Kim ___ in the marketing department since last year.","o":["has worked","works","worked","will work"],"qko":"김 씨는 작년부터 마케팅 부서에서 일하고 있어요."},{"id":"t-07","lang":"en","lv":0,"cat":"동사","pat":"when / if / as soon as + 현재 시제","ko":"때·조건 부사절은 미래 대신 현재","note":"when, if, as soon as가 이끄는 절은 미래 일이라도 현재 시제로 써요. 주절은 will을 써요.","ex":"Please call me as soon as the shipment arrives.","exko":"물건이 도착하는 대로 전화 주세요.","q":"We will begin the meeting when everyone ___.","o":["arrives","will arrive","arrived","arriving"],"qko":"모두 도착하면 회의를 시작할게요."},{"id":"t-08","lang":"en","lv":0,"cat":"동사","pat":"be + p.p. (+ by)","ko":"수동태","note":"주어가 동작을 받는 쪽이면 be+p.p.를 써요. 빈칸 뒤에 목적어가 없으면 수동태일 가능성이 커요.","ex":"The report must be submitted by Friday.","exko":"보고서는 금요일까지 제출되어야 해요.","q":"All orders will be ___ within two business days.","o":["shipped","shipping","ship","shipment"],"qko":"모든 주문은 영업일 기준 이틀 안에 발송돼요."},{"id":"t-09","lang":"en","lv":0,"cat":"준동사","pat":"plan / decide / hope + to 동사원형","ko":"to부정사를 목적어로 쓰는 동사","note":"앞으로 할 일을 나타내는 동사 뒤에는 to부정사가 와요. plan, decide, hope, agree, intend, expect 등이 있어요.","ex":"The company plans to open a new branch in Busan.","exko":"회사는 부산에 새 지점을 열 계획이에요.","q":"The manager decided ___ the deadline by one week.","o":["to extend","extending","extend","extended"],"qko":"매니저는 마감을 일주일 늦추기로 했어요."},{"id":"t-10","lang":"en","lv":0,"cat":"준동사","pat":"consider / avoid / finish + -ing","ko":"동명사를 목적어로 쓰는 동사","note":"consider, avoid, finish, suggest, recommend, postpone 뒤에는 -ing가 와요.","ex":"We are considering moving to a larger office.","exko":"더 큰 사무실로 옮기는 것을 고려하고 있어요.","q":"Customers should avoid ___ the device near water.","o":["using","to use","use","used"],"qko":"고객은 물 근처에서 기기를 쓰지 않아야 해요."},{"id":"t-11","lang":"en","lv":0,"cat":"준동사","pat":"전치사 + -ing / look forward to -ing","ko":"전치사 뒤에는 동명사","note":"전치사 뒤에는 동사가 -ing 형태로 와요. look forward to, be committed to의 to는 전치사라서 -ing가 와요.","ex":"We look forward to working with you.","exko":"함께 일하기를 기대합니다.","q":"Thank you for ___ our annual conference.","o":["attending","attend","attended","to attend"],"qko":"연례 학회에 참석해 주셔서 감사합니다."},{"id":"t-12","lang":"en","lv":0,"cat":"준동사","pat":"-ing (능동) / p.p. (수동) + 명사","ko":"현재분사와 과거분사","note":"꾸밈을 받는 명사가 동작을 하면 -ing, 동작을 받으면 p.p.를 써요. attached file, updated schedule이 자주 나와요.","ex":"Please review the attached document.","exko":"첨부된 문서를 검토해 주세요.","q":"Please refer to the ___ schedule for the new meeting times.","o":["revised","revising","revise","revises"],"qko":"바뀐 회의 시간은 수정된 일정표를 참고해 주세요."},{"id":"t-13","lang":"en","lv":0,"cat":"준동사","pat":"-ing (감정을 주는 쪽) / p.p. (느끼는 사람)","ko":"감정을 나타내는 분사","note":"감정을 일으키는 쪽은 -ing, 감정을 느끼는 사람은 p.p.를 써요.","ex go","going","gone"],"qko":"매니저는 신입 직원들을 일찍 집에 보내 줬어요."},{"id":"t-24","lang":"en","lv":0,"cat":"비교·기타","pat":"each/every + 단수, many/few + 복수","ko":"수량 형용사","note":"each와 every 뒤에는 단수 명사와 단수 동사가 와요. information, equipment는 셀 수 없는 명사예요.","ex":"Each participant will receive a certificate.","exko":"참가자마다 수료증을 받게 돼요.","q":"Every ___ must wear a name tag.","o":["visitor","visitors","visit","visiting"],"qko":"모든 방문객은 이름표를 달아야 해요."},{"id":"t-25","lang":"en","lv":0,"cat":"연결어","pat":"by (완료 기한) / until (계속)","ko":"기한 by와 계속 until","note":"그때까지 한 번 끝내면 by, 그때까지 계속 이어지면 until을 써요.","ex":"The store will be closed until Monday.","exko":"가게는 월요일까지 문을 닫아요.","q":"Please submit your expense report ___ Friday.","o":["by","until","since","during"],"qko":"경비 보고서를 금요일까지 제출해 주세요."},{"id":"t-26","lang":"en","lv":0,"cat":"연결어","pat":"during + 기간 이름 / for + 시간 길이","ko":"during과 for","note":"during 뒤에는 the meeting처럼 특정 기간이, for 뒤에는 three hours처럼 숫자로 된 길이가 와요.","ex":"Phones must be turned off during the presentation.","exko":"발표 중에는 휴대폰을 꺼야 해요.","q":"The system will be unavailable ___ two hours tonight.","o":["for","during","while","since"],"qko":"오늘 밤 두 시간 동안 시스템을 쓸 수 없어요."},{"id":"t-27","lang":"en","lv":0,"cat":"동사","pat":"recommend / request that + 주어 + 동사원형","ko":"요구·제안의 that절","note":"recommend, suggest, request, require 뒤의 that절에는 주어가 3인칭이라도 동사원형을 써요.","ex":"The doctor recommended that he take a few days off.","exko":"의사는 그에게 며칠 쉬라고 권했어요.","q":"The manager requested that every employee ___ the training.","o":["complete","completes","completed","completing"],"qko":"매니저는 모든 직원이 교육을 이수하도록 요청했어요."},{"id":"t-28","lang":"en","lv":0,"cat":"품사 자리","pat":"명사 + 명사 (sales report)","ko":"복합명사","note":"safety regulations, customer satisfaction처럼 명사 두 개가 붙어 하나의 뜻을 만들어요. 앞 명사는 보통 단수형이에요.","ex":"Please follow the safety regulations at all times.","exko":"항상 안전 규정을 지켜 주세요.","q":"Our goal is to improve customer ___.","o":["satisfaction","satisfy","satisfied","satisfying"],"qko":"우리 목표는 고객 만족을 높이는 거예요."},{"id":"t-29","lang":"en","lv":0,"cat":"비교·기타","pat":"another / the other / the others","ko":"부정대명사","note":"여럿 중 또 하나는 another, 둘 중 나머지 하나는 the other, 나머지 전부는 the others예요.","ex":"One printer is working, but the other is broken.","exko":"프린터 하나는 되는데 나머지 하나는 고장 났어요.","q":"This room is too small. Could you show us ___ one?","o":["another","other","others","the others"],"qko":"이 방은 너무 작아요. 다른 방을 보여 주시겠어요?"},{"id":"t-30","lang":"en","lv":0,"cat":"연결어","pat":"However, / Therefore, / As a result,","ko":"접속부사","note":"문장과 문장의 관계(반대·결과·추가)를 보여 주는 말이에요. 두 절을 하나로 묶지는 못해서 마침표나 세미콜론 뒤에 와요.","ex":"Sales fell in May. However, they recovered in June.","exko":"5월에는 매출이 떨어졌어요. 하지만 6월에 회복했어요.","q":"The train was delayed. ___, we arrived late for the meeting.","o":["As a result","However","In contrast","Otherwise"],"qko":"기차가 늦었어요. 그 결과 회의에 늦게 도착했어요."}];

const T1 = 'āēīōūǖĀĒĪŌŪǕ', T2 = 'áéíóúǘÁÉÍÓÚǗ', T3 = 'ǎěǐǒǔǚǍĚǏǑǓǙ', T4 = 'àèìòùǜÀÈÌÒÙǛ';
const BASEV = 'aeiouüAEIOUÜ';
const TONES = [T1, T2, T3, T4];
function toneOf(s) { for (const ch of s) for (let t = 0; t < 4; t++) if (TONES[t].includes(ch)) return t + 1; return 5; }
function stripMark(s) {
  let o = '';
  for (const ch of s) { let k = -1; for (const T of TONES) { const i = T.indexOf(ch); if (i >= 0) { k = i; break; } } o += k >= 0 ? BASEV[k] : ch; }
  return o;
}
function applyTone(base, t) {
  if (t === 5) return base;
  const low = base.toLowerCase();
  let idx = -1;
  if (low.includes('a')) idx = low.indexOf('a');
  else if (low.includes('e')) idx = low.indexOf('e');
  else if (low.includes('ou')) idx = low.indexOf('o');
  else for (let i = low.length - 1; i >= 0; i--) if ('iouü'.includes(low[i])) { idx = i; break; }
  if (idx < 0) return base;
  const k = BASEV.indexOf(base[idx]);
  return base.slice(0, idx) + TONES[t - 1][k] + base.slice(idx + 1);
}
const plainPy = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s.'’-]/g, '').replace(/v/g, 'u');
function enStem(h) { let s = h.toLowerCase(); if (s.length <= 3) return s; s = s.replace(/(e|y)$/, ''); if (s.length > 5) s = s.slice(0, -1); return s; }

const WORDS_ZH = RAW.trim().split('\n').map(line => {
  const [no, h, sense, p, m, pos, r] = line.split('|');
  const n = +no, words = p.split(' ').map(w => w.split('.')), syl = [];
  words.forEach(w => w.forEach(s => syl.push({ s, t: s === 'r' ? 5 : toneOf(s) })));
  return { id: no, lang: 'zh', no: n, lv: n <= 3600 ? 5 : 6, h, sense, p, m, pos, r: +r, words, syl, chars: [...h], plain: plainPy(p) };
});
const WORDS_EN = RAW_EN.trim().split('\n').map(line => {
  const [no, h, m, pos] = line.split('|');
  return { id: 'e' + no, lang: 'en', no: +no, h, m, pos, r: +no - 1, stem: enStem(h), plain: h.toLowerCase(), chars: [...h] };
});
const WORDS = [...WORDS_ZH, ...WORDS_EN];

  else if (a === 'closet') { openSheet('closet'); S.settings.seenItems = unlockedIds(); save(); renderHeader(); }
  else if (a === 'settings') { resetAsk = false; openSheet('settings'); }
  else if (a === 'sheetclose') closeSheet();
  else if (a === 'equip') equip(el.dataset.id);
  else if (a === 'quizopen') openSheet('quizsend');
  else if (a === 'quizclose') closeSheet();
  else if (a === 'sendquiz') { const p = partner(), ids = p && Array.isArray(p.weak) ? p.weak.filter(id => byId[id]).slice(0, 5) : []; if (ids.length) { S.settings.lastQuiz = Date.now(); save(); closeSheet(); sendNote('quiz', '', { ids }); renderPetInfo(); } }
  else if (a === 'pquiz') startPartnerQuiz();
  else if (a === 'gquiz') { gsession.stage = 'quiz'; gsession.learned = true; render(); }
  else if (a === 'gpick') gpick(+el.dataset.i);
  else if (a === 'gnext') gnext();
  else if (a === 'gmore') { S.daily.gbonus = (S.daily.gbonus || 0) + 2; save(); buildGQueue(); render(); }
  else if (a === 'gexpand') { gExpanded = gExpanded === el.dataset.id ? null : el.dataset.id; refreshGList(); }
  else if (a === 'gfilter') { gListF = el.dataset.f; refreshGList(); }
  else if (a === 'cheeropen') openSheet('cheer');
  else if (a === 'cheerclose') closeSheet();
  else if (a === 'invite') openSheet('invite');
  else if (a === 'closebanner') { if (couple.banner) { S.settings.inboxSeen = Math.max(S.settings.inboxSeen || 0, +couple.banner.at || 0); save(); } couple.banner = null; renderBanner(); }
  else if (a === 'reset') { resetAsk = true; renderSide(); }
  else if (a === 'resetno') { resetAsk = false; renderSide(); }
  else if (a === 'switchwho') { try { localStorage.removeItem('suchan-who'); localStorage.removeItem(LS_KEY); } catch (x) {} location.reload(); }
  else if (a === 'copylink') { const u = window.__roomLink || location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => petSay('링크를 복사했어! 짝꿍에게 보내 줘', 'happy', 2400), () => prompt('이 링크를 복사해 주세요', u)); }
  else if (a === 'resetyes') { const keep = S.settings; S = defaultState(); S.settings = keep; resetAsk = false; quiz = null; save(); buildQueue(); buildGQueue(); render(); writeMember(true); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'cheer') return;
  e.preventDefault();
  const i = document.getElementById('cheerin'), txt = i ? i.value.trim() : '';
  if (!txt) return;
  i.blur(); closeSheet(); sendNote('cheer', txt);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { listQ = e.target.value; listLimit = 150; renderWords(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'exam') { S.settings.exam = /^\d{4}-\d{2}-\d{2}$/.test(e.target.value) ? e.target.value : ''; save(); writeMember(); const db = document.querySelector('.deckbar'); render(); return; }
  if (e.target.id === 'nick') { S.settings.nick = e.target.value.trim().slice(0, 12); save(); writeMember(); renderPetInfo(); } });
document.addEventListener('keydown', e => {
  if (sheet) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || !S.settings.track) return;
  const k = e.key;
  if (tab === 'study') {
    if ((k === ' ' || k === 'Enter') && !session.flipped && session.queue.length) { e.preventDefault(); flip(); }
    else if (session.flipped && ['1', '2', '3'].includes(k)) rate(+k - 1);
    else if ((k === 'p' || k === 'P') && session.queue[0]) speak(byId[session.queue[0]].h, byId[session.queue[0]].lang);
  } else if (tab === 'gram') {
    if (!gsession.queue.length) return;
    if (gsession.stage === 'learn' && (k === ' ' || k === 'Enter')) { e.preventDefault(); gsession.stage = 'quiz'; gsession.learned = true; render(); }
    else if (gsession.stage === 'quiz' && gsession.picked == null && ['1', '2', '3', '4'].includes(k)) gpick(+k - 1);
    else if (gsession.picked != null && (k === 'Enter' || k === ' ')) { e.preventDefault(); gnext(); }
  } else if (tab === 'quiz' && game) {
    if (k === 'Escape') quitGame();
    else if (game.phase === 'play' && game.picked == null && ['1', '2', '3', '4'].includes(k)) gamePick(+k - 1);
    else if (game.phase === 'over' && k === 'Enter' && e.target === document.body) { e.preventDefault(); startGame(); }
  } else if (tab === 'quiz') {
    if (!quiz || quiz.i >= quiz.qs.length) { if (k === 'Enter' && e.target === document.body) { e.preventDefault(); startQuiz(); } }
    else if (quiz.picked == null && ['1', '2', '3', '4'].includes(k)) pick(+k - 1);
    else if (quiz.picked != null && (k === 'Enter' || k === ' ')) { e.preventDefault(); nextQ(); }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (game && game.phase === 'play' && game.picked == null) game.pausedAt = performance.now(); if (writeTimer) { clearTimeout(writeTimer); flushRemote(); } return; }
  if (game && game.pausedAt) { game.tStart += performance.now() - game.pausedAt; game.pausedAt = 0; runGameTimer(); }
  const before = S.daily.day; ensureDaily();
  if (before !== S.daily.day) { if (!session.queue.length) buildQueue(); if (gsession.picked == null) buildGQueue(); render(); }
});

/* ---------- 발음 ---------- */
const audio = { voices: { zh: null, en: null }, tts: null };
const hasAudio = lang => !!(audio.voices[lang] || audio.tts);
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices() || [];
    const zh = vs.filter(v => /^zh/i.test(v.lang)), en = vs.filter(v => /^en/i.test(v.lang));
    audio.voices.zh = zh.find(v => /zh[-_]CN/i.test(v.lang)) || zh.find(v => !/HK|TW|yue/i.test(v.lang)) || zh[0] || null;
    audio.voices.en = en.find(v => /en[-_]US/i.test(v.lang)) || en[0] || null;
    refreshAudio();
  } catch (e) {}
}
function refreshAudio() { document.body.classList.toggle('no-audio', !hasAudio(TR().voice)); }
try { if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } } catch (e) {}
function speak(text, lang) {
  if (!text) return;
  lang = lang === 'en' ? 'en' : 'zh';
  const v = audio.voices[lang];
  if (v) {
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = lang === 'en' ? .95 : .85; speechSynthesis.speak(u); return; } catch (e) {}
  }
  if (audio.tts) audio.tts.speak(text, { language: lang === 'en' ? 'en' : 'zh-CN', rate: lang === 'en' ? 1 : .85 }).catch(err => { if (err && err.code === 'not_granted') { audio.tts = null; refreshAudio(); } });
}

/* ---------- 계정 저장 · 공유 저장소 연결 ---------- */
const remote = { ref: null, writing: false, pending: false };
let writeTimer = null;
function queueRemote() { if (!remote.ref) return; clearTimeout(writeTimer); writeTimer = setTimeout(flushRemote, 1200); }
async function flushRemote() {
  writeTimer = null;
  if (!remote.ref) return;
  if (remote.writing) { remote.pending = true; return; }
  remote.writing = true; setSync('saving');
  try { await remote.ref.set({ json: JSON.stringify(S), updated: S.updated }); setSync('synced'); writeMember(); }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted') { setSync('error'); setTimeout(queueRemote, 1500 + Math.random() * 1500); }
    else { remote.ref = null; setSync('local'); }
  }
  remote.writing = false;
  if (remote.pending) { remote.pending = false; queueRemote(); }
}
async function initRemote() {
  const use = window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n) : null;
  if (!use) { ex.ready = true; remoteState = 'done'; couple.ready = true; render(); return; }
  remoteState = 'pending'; if (!S.settings.track) render();
  let db = null, user = null, sample = null;
  try { [db, user, sample] = await Promise.all([use('db'), use('user'), use('sample')]); } catch (e) {}
  ex.db = db || null; ex.sample = sample || null; ex.ready = true;
  if (ex.sample && ex.state === 'idle' && !S.settings.exOk) ex.state = 'need';
  pumpEx(); updateExSlots();
  try {
    if (!db || !user) throw 0;
    const uid = await user.id();
    if (!uid) throw 0;
    couple.db = db; couple.user = user; couple.me = String(uid);
    try { couple.owner = !!user.isOwner(); } catch (e) {}
    try { const me = await user.me(); if (me && me.name) couple.profiles[couple.me] = me; } catch (e) {}
    const ref = db.collection('data/users/' + uid).doc('hsk56');
    setSync('loading');
    let done = false;
    const timer = setTimeout(() => { if (!done) setSync('slow'); }, 10000);
    let snap;
    try { snap = await ref.get(); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { snap = await ref.get(); } catch (e2) {} } }
    done = true; clearTimeout(timer);
    if (snap) {
      remote.ref = ref;
      let rs = null;
      if (snap.exists) { try { rs = normalize(JSON.parse(snap.data().json)); } catch (e) {} }
      if (rs && rs.updated > S.updated) { S = rs; persistLocal(); if (!session.touched && !session.flipped) buildQueue(); if (gsession.picked == null && !gsession.learned) buildGQueue(); }
      else if (S.updated > 0) flushRemote();
      setSync('synced');
    } else setSync('local');
    db.collection('members').onSnapshot(s => { const prev = partner(); couple.members = s.docs.map(d => d.data()).filter(m => m && m.uid); onMembers(prev); }, () => {});
    db.doc('pet/look').onSnapshot(s => {
      const d = s.exists ? s.data() : null;
      if (d) couple.look = { head: d.head || '', face: d.face || '', neck: d.neck || '', bg: d.bg || '', best: +d.best || 0, goal: +d.goal || 0 };
      couple.lookReady = true;
      try { localStorage.setItem('zh-hsk56-look', JSON.stringify(couple.look)); } catch (e) {}
      updateScreenBg(); renderCloset(); paintPet(performance.now()); maybeBest(); renderPetInfo();
    }, () => {});
    db.doc('inbox/' + segId(couple.me)).onSnapshot(s => { const d = s.exists ? s.data() : null; couple.inbox = d && Array.isArray(d.items) ? d.items : []; onInbox(); }, () => {});
    writeMember(true);
  } catch (e) { if (syncState === 'loading') setSync('local'); }
  couple.ready = true; remoteState = 'done';
  if (!session.queue.length && S.settings.track) buildQueue();
  if (!gsession.queue.length && S.settings.track) buildGQueue();
  render();
}
(async () => { try { const t = window.claude && window.claude.use ? await window.claude.use('tts') : null; if (t) { audio.tts = t; refreshAudio(); } } catch (e) {} })();

/* ---------- 시작 ---------- */
function start(data) {
  data = data || {};
  if (['study', 'quiz', 'gram', 'list'].includes(data.tab)) tab = data.tab;
  if (data.session && Array.isArray(data.session.queue) && data.session.queue.every(id => byId[id])) { session = Object.assign({ flipped: false, touched: false, justFlipped: false }, data.session); wantEx(session.queue.slice(0, 24)); }
  else buildQueue();
  if (data.quiz && Array.isArray(data.quiz.qs) && data.quiz.qs.every(q => byId[q.id])) quiz = data.quiz;
  if (data.gsession && Array.isArray(data.gsession.queue) && data.gsession.queue.every(id => gById[id])) gsession = Object.assign({ order: [0, 1, 2, 3], picked: null, learned: false, showDetail: false }, data.gsession);
  else buildGQueue();
  render(); startPet(); initRemote();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ tab, session, quiz, gsession })); } catch (e) {}
if (location.protocol === 'file:' || location.hostname === 'localhost') window.__sc = { S: () => S, session: () => session, saveLook, petSay, suchanHTML, game: () => game };
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
};

<script type="module">
/* Claude 밖 독립판: Firebase(익명 로그인 + Firestore)로 둘의 기록을 저장한다.
   링크의 #r=방코드 로 둘만의 공간을 정하고, 처음 열 때 이 폰이 누구 것인지 고른다. */
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const WHO = { suyeon: { name: '수연', track: 'zh', deck: 'h5' }, chanwoo: { name: '찬우', track: 'en', deck: 't1' } };
const boot = document.getElementById('boot');
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const hm = location.hash.match(/r=([A-Za-z0-9]{16,40})/);
if (hm) { ls.set('suchan-room', hm[1]); }
const room = ls.get('suchan-room');
window.__roomLink = room ? `${location.origin}${location.pathname}#r=${room}` : '';
function show(html) { boot.innerHTML = `<div class="boot-card">${html}</div>`; boot.hidden = false; }
function askRoom() {
  show(`<img class="hero" src="img/couple.webp" alt=""><h1>수찬 단어장</h1><p>처음 받은 단어장 링크로 열어 주세요.<br>링크를 아래에 붙여 넣어도 돼요.</p>
    <input id="roomin" placeholder="https://…#r=…" autocomplete="off"><button class="btn primary wide" id="roomok">열기</button>`);
  document.getElementById('roomok').onclick = () => {
    const v = document.getElementById('roomin').value.trim();
    const mm = v.match(/r=([A-Za-z0-9]{16,40})/) || v.match(/^([A-Za-z0-9]{16,40})$/);
    if (mm) { ls.set('suchan-room', mm[1]); location.reload(); }
  };
}
function askWho() {
  return new Promise(res => {
    show(`<img class="hero" src="img/couple.webp" alt=""><h1>수찬 단어장</h1><p>이 폰은 누구의 단어장인가요?</p>
      <div class="who-btns"><button class="who-btn zh" data-who="suyeon"><img src="img/av-suyeon.webp" alt=""><b>수연</b><span>중국어 HSK 5·6급</span></button>
      <button class="who-btn en" data-who="chanwoo"><img src="img/av-chanwoo.webp" alt=""><b>찬우</b><span>영어 토익</span></button></div>`);
    boot.querySelectorAll('[data-who]').forEach(b => { b.onclick = () => res(b.dataset.who); });
  });
}
async function main() {
  let cfg = null;
  try { cfg = (await import('./config.js')).FIREBASE_CONFIG; } catch (e) {}
  if (!cfg || !cfg.apiKey) { show('<img class="hero" src="img/couple.webp" alt=""><h1>수찬 단어장</h1><p>저장소를 준비하고 있어요. 잠시 뒤에 다시 열어 주세요.</p>'); return; }
  if (!room) { askRoom(); return; }
  let who = ls.get('suchan-who');
  if (!WHO[who]) { who = await askWho(); ls.set('suchan-who', who); }
  try {
    const s = JSON.parse(ls.get('zh-hsk56-v1') || '{}') || {};
    s.settings = s.settings || {};
    if (!s.settings.track) { s.settings.track = WHO[who].track; s.settings.deck = WHO[who].deck; ls.set('zh-hsk56-v1', JSON.stringify(s)); }
  } catch (e) {}
  boot.hidden = true; boot.innerHTML = '';
  const ready = (async () => {
    const [{ initializeApp }, { getAuth, signInAnonymously }, F] = await Promise.all([
      import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')]);
    const app = initializeApp(cfg);
    let fs;
    try { fs = F.initializeFirestore(app, { ignoreUndefinedProperties: true, localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch (e) { fs = F.getFirestore(app); }
    try { await signInAnonymously(getAuth(app)); }
    catch (e) {
      console.warn('auth', e && e.code);
      if (e && /operation-not-allowed|admin-restricted/.test(e.code || '')) {   // Firebase에서 익명 로그인이 꺼져 있으면 알려 준다
        const t = document.createElement('div'); t.className = 'boot-toast';
        t.textContent = 'Firebase에서 익명 로그인이 꺼져 있어서 기록이 저장되지 않아요. Authentication → 로그인 방법에서 "익명"을 켜 주세요.';
        document.body.appendChild(t);
      }
    }
    const base = `rooms/${room}/`;
    const code = e => ({ code: ({ 'permission-denied': 'not_granted', unavailable: 'unavailable', 'resource-exhausted': 'resource_exhausted', 'invalid-argument': 'invalid_argument' })[e && e.code] || 'unknown', message: e && e.message, __m: true });
    const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });
    const docApi = path => {
      const ref = F.doc(fs, base + path);
      return {
        id: ref.id, path,
        get: async () => { try { return wrap(await F.getDoc(ref)); } catch (e) { throw code(e); } },
        set: async v => { try { await F.setDoc(ref, JSON.parse(JSON.stringify(v))); } catch (e) { throw code(e); } },
        onSnapshot: (cb, err) => F.onSnapshot(ref, s => cb(wrap(s)), e => err && err(code(e))),
      };
    };
    const colApi = (path, conds = []) => {
      const ref = F.collection(fs, base + path);
      const q = () => conds.length ? F.query(ref, ...conds.map(c => F.where(c[0], c[1], c[2]))) : ref;
      return {
        path, doc: id => docApi(path + '/' + id),
        where: (f, op, v) => colApi(path, conds.concat([[f, op, v]])),
        get: async () => {
          try {
            const inC = conds.find(c => c[1] === 'in' && Array.isArray(c[2]) && c[2].length > 30);
            if (inC) {   // Firestore 'in'은 한 번에 30개까지라 나눠서 묻는다
              const rest = conds.filter(c => c !== inC), out = [];
              for (let k = 0; k < inC[2].length; k += 30) out.push(...(await colApi(path, rest.concat([[inC[0], 'in', inC[2].slice(k, k + 30)]])).get()).docs);
              return { docs: out, size: out.length, empty: !out.length };
            }
            const qs = await F.getDocs(q()); return { docs: qs.docs.map(wrap), size: qs.size, empty: qs.empty };
          } catch (e) { throw e && e.__m ? e : code(e); }
        },
        onSnapshot: (cb, err) => F.onSnapshot(q(), qs => cb({ docs: qs.docs.map(wrap), size: qs.size }), e => err && err(code(e))),
      };
    };
    const user = { id: async () => who, isOwner: () => who === 'suyeon', me: async () => ({ name: WHO[who].name }),
      profiles: async ids => Object.fromEntries(ids.map(i => [i, { name: (WHO[i] || {}).name || '짝꿍' }])) };
    return { db: { doc: docApi, collection: colApi }, user };
  })().catch(e => { console.warn('firebase', e); return { db: null, user: null }; });
  window.__standalone = true;
  window.claude = { use: async n => { const r = await ready; return n === 'db' ? r.db : n === 'user' ? r.user : null; } };
  window.__app();
}
main();
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
