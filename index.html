<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수찬 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#e3f5ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수찬 단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  /* 레이아웃: 위에 바오가 사는 작은 화면, 그 아래 田字格 단어 카드. 오른쪽에 급수·진도·설정. 좁은 화면에서는 위아래로 쌓는다.
     스티커처럼 굵은 외곽선과 밀린 그림자, 파스텔 세 가지(분홍·노랑·민트)를 역할별로 쓴다 */
  --paper: #efeaff;
  --surface: #ffffff;
  --ink: #2a2340;
  --muted: #736a90;
  --line: #2a2340;
  --hair: #ddd5f5;
  --soft: #f5f2ff;
  --pink: #ff86b6; --pink-soft: #ffe3ef;
  --yellow: #ffd36a; --yellow-soft: #fff2cc;
  --mint: #72d9ba; --mint-soft: #dcf6ed;
  --screen: #fff7de;
  --grid: rgba(255, 110, 165, .55);
  --mark: rgba(255, 211, 106, .6);
  --t1: #e0335a; --t2: #1f9a5c; --t3: #2f6ad8; --t4: #9a46c9; --t5: #8d86a3;
  --good: #1f9a5c; --bad: #d93a5e;
  --shadow: 3px 3px 0 var(--line);
  --shadow-l: 5px 5px 0 var(--line);
  --font-display: "Jua", "BM JUA", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-py: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-pixel: "Silkscreen", "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17132a; --surface: #241e3b; --ink: #f2edff; --muted: #a99fc8; --line: #07050f; --hair: #3a3258; --soft: #2c2548;
    --pink: #ff8fbd; --pink-soft: #4a2343; --yellow: #ffd673; --yellow-soft: #45391b; --mint: #7fe2c4; --mint-soft: #1b3b35;
    --screen: #2f2853; --grid: rgba(255, 143, 189, .45); --mark: rgba(255, 214, 115, .35);
    --t1: #ff7c95; --t2: #5fd393; --t3: #82a8ff; --t4: #cf8cf5; --t5: #a29bbc;
    --good: #5fd393; --bad: #ff7c95;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17132a; --surface: #241e3b; --ink: #f2edff; --muted: #a99fc8; --line: #07050f; --hair: #3a3258; --soft: #2c2548;
  --pink: #ff8fbd; --pink-soft: #4a2343; --yellow: #ffd673; --yellow-soft: #45391b; --mint: #7fe2c4; --mint-soft: #1b3b35;
  --screen: #2f2853; --grid: rgba(255, 143, 189, .45); --mark: rgba(255, 214, 115, .35);
  --t1: #ff7c95; --t2: #5fd393; --t3: #82a8ff; --t4: #cf8cf5; --t5: #a29bbc;
  --good: #5fd393; --bad: #ff7c95;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  background-color: var(--paper);
  background-image: radial-gradient(var(--hair) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
@media (hover: none) { kbd { display: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }
body.notone :is(.t1, .t2, .t3, .t4, .t5) { color: var(--ink); }

.app {
  max-width: 1100px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 32px) 56px;
  display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px 30px; align-items: start;
}
main { display: grid; gap: 18px; align-content: start; min-width: 0; }
.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 52px; height: 52px; flex: none; border-radius: 16px; border: 2px solid var(--line); background: var(--screen);
  box-shadow: var(--shadow); display: grid; place-items: center;
}
.logo canvas { width: 40px; height: 32px; image-rendering: pixelated; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.15; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

.tabs { display: flex; gap: 6px; padding: 5px; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; color: var(--muted); font-family: var(--font-display); font-size: 16px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--yellow); color: #2a2340; }

/* 바오 */
.pet {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center;
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-l); padding: 14px 18px 14px 14px;
}
.pet-screen {
  width: 172px; height: 136px; border: 2px solid var(--line); border-radius: 18px; display: grid; place-items: center;
  background-color: var(--screen);
  background-image: linear-gradient(transparent 70%, rgba(114, 217, 186, .35) 70%), radial-gradient(rgba(42, 35, 64, .09) 1px, transparent 1.2px);
  background-size: 100% 100%, 8px 8px;
}
.pet-screen canvas { width: 160px; height: 128px; image-rendering: pixelated; }
.pet-info { display: grid; gap: 8px; min-width: 0; }
.bubble {
  position: relative; margin: 0 0 2px; justify-self: start; max-width: 100%;
  background: var(--soft); border: 2px solid var(--line); border-radius: 14px; padding: 7px 12px;
  font-family: var(--font-display); font-size: 16px; line-height: 1.35;
}
.bubble::before {
  content: ""; position: absolute; left: -9px; top: 12px; width: 12px; height: 12px; background: var(--soft);
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg);
}
.pet-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pet-name { font-family: var(--font-display); font-size: 19px; }
.lv { font-family: var(--font-pixel); font-size: 12px; background: var(--ink); color: var(--surface); padding: 2px 7px; border-radius: 6px; }
.xp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-width: 260px; }
.xp i { height: 10px; border: 2px solid var(--line); border-radius: 3px; background: var(--surface); }
.xp i.on { background: var(--mint); }
.pet-row.small { font-size: 12.5px; color: var(--muted); }
.hearts { display: inline-flex; gap: 3px; }
.hearts svg { width: 16px; height: 14px; display: block; }

/* 카드 */
.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 26px; box-shadow: var(--shadow-l);
  padding: clamp(18px, 3vw, 28px); display: flex; flex-direction: column; gap: 18px; min-height: 480px;
}
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.remain { margin-left: auto; font-family: var(--font-display); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; border: 2px solid var(--line);
  background: var(--yellow-soft); color: var(--ink); font-family: var(--font-display); font-size: 14px; line-height: 1.5;
}
.st { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-family: var(--font-display); }
.st-new { border: 2px dashed var(--muted); color: var(--muted); }
.st-learn { background: var(--soft); border: 2px solid var(--hair); }
.st-learn i { width: 7px; height: 7px; border-radius: 2px; background: var(--hair); display: block; }
.st-learn i.on { background: var(--mint); outline: 1.5px solid var(--line); }
.st-done { background: var(--pink); color: #2a2340; border: 2px solid var(--line); transform: rotate(-4deg); }

.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 4px 0; }
.stage.tap { cursor: pointer; }
.tzg { display: flex; }
.cw { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cw + .cw .cell { border-left-width: 0; }
.cell { width: var(--cell); height: var(--cell); position: relative; border: 2px solid var(--grid); background: var(--surface); display: grid; place-items: center; }
.cw:first-child .cell { border-radius: 10px 0 0 10px; }
.cw:last-child .cell { border-radius: 0 10px 10px 0; }
.cw:first-child:last-child .cell { border-radius: 10px; }
.cell::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dashed var(--grid); }
.cell::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1.5px dashed var(--grid); }
.hz { position: relative; z-index: 1; font-family: var(--font-han); font-weight: 500; font-size: calc(var(--cell) * .7); line-height: 1; color: var(--ink); }
.hz.t1 { color: var(--t1); } .hz.t2 { color: var(--t2); } .hz.t3 { color: var(--t3); } .hz.t4 { color: var(--t4); } .hz.t5 { color: var(--t5); }
body.notone .hz { color: var(--ink); }
.tzg.n1 { --cell: clamp(116px, 32vw, 156px); }
.tzg.n2 { --cell: clamp(98px, 28vw, 128px); }
.tzg.n3 { --cell: clamp(78px, 24vw, 106px); }
.tzg.n4 { --cell: clamp(62px, 19vw, 88px); }
.py { font-family: var(--font-py); font-size: clamp(17px, 2.4vw, 21px); font-weight: 700; line-height: 1.2; }
.reveal .py { animation: rise .35s ease both; animation-delay: calc(var(--i) * 70ms); }
.reveal .hz { animation: ink .55s ease both; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes ink { from { color: var(--ink); } }

.mean-big { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4.6vw, 36px); text-align: center; text-wrap: balance; margin: 0; line-height: 1.3; }
.hint { color: var(--muted); font-size: 13.5px; margin: 0; text-align: center; }
.pos { font-size: 12.5px; color: var(--muted); border: 2px solid var(--hair); padding: 0 9px; border-radius: 999px; white-space: nowrap; font-family: var(--font-display); }

/* 예문 */
.exslot { width: 100%; }
.ex { background: var(--yellow-soft); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; display: grid; gap: 3px; width: 100%; }
.ex-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 13.5px; color: var(--muted); }
.ex-head .spk { margin-left: auto; width: 34px; height: 34px; }
.ex-zh { font-family: var(--font-han); font-size: 19px; margin: 0; line-height: 1.6; }
.ex-zh mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--pink); }
.ex-py { font-family: var(--font-py); color: var(--muted); margin: 0; font-size: 14px; }
.ex-ko { margin: 0; font-size: 14.5px; }
.ex.wait { background: var(--soft); border-style: dashed; border-color: var(--muted); }
.ex.wait .ex-zh { color: var(--muted); font-family: var(--font-body); font-size: 14px; }
.ex .link { justify-self: start; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.back { display: grid; gap: 14px; border-top: 2px dashed var(--hair); padding-top: 16px; animation: rise .35s ease both; }
.mrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meaning { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.3; text-wrap: pretty; }
.mrow .spk { margin-left: auto; }

.btn {
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  padding: 11px 18px; font-family: var(--font-display); font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s, box-shadow .08s;
}
.btn:active, .rate button:active, .opt:not(:disabled):active, .deck:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
.btn.primary { background: var(--pink); color: #2a2340; }
.btn.wide { width: 100%; }
kbd { font-family: var(--font-pixel); font-size: 10px; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; opacity: .6; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }

.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rate button {
  border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; font-family: var(--font-display); font-size: 17px; color: #2a2340;
  transition: transform .08s, box-shadow .08s;
}
.rate button[data-r="0"] { background: var(--pink); }
.rate button[data-r="1"] { background: var(--yellow); }
.rate button[data-r="2"] { background: var(--mint); }
.rate small { font-family: var(--font-body); font-size: 12px; opacity: .8; }
.rate .lbl { display: flex; align-items: center; gap: 6px; }

.spk {
  width: 38px; height: 38px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); box-shadow: 2px 2px 0 var(--line);
  display: inline-grid; place-items: center; color: var(--ink); padding: 0;
}
.spk:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--line); }
.spk svg { width: 17px; height: 17px; }
.spk.big { width: 92px; height: 92px; background: var(--mint-soft); box-shadow: var(--shadow); }
.spk.big svg { width: 36px; height: 36px; }
body.no-audio .spk { display: none; }

.done { align-items: flex-start; justify-content: center; }
.stamp {
  width: 84px; height: 84px; border: 3px solid var(--line); background: var(--pink); color: #2a2340; border-radius: 20px; box-shadow: var(--shadow);
  display: grid; place-items: center; font-family: var(--font-han); font-size: 48px; font-weight: 700;
  transform: rotate(-6deg); animation: stamp .45s cubic-bezier(.2, .8, .3, 1.25) both;
}
@keyframes stamp { from { transform: rotate(-6deg) scale(1.6); opacity: 0; } }
.done h2, .quiz h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.25; }
.done p, .quiz p.lead { margin: 0; color: var(--muted); max-width: 54ch; }

/* 사이드 */
.side { display: grid; gap: 16px; position: sticky; top: 16px; }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats > div { background: var(--soft); border-radius: 12px; padding: 8px 10px; }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.decks { display: grid; gap: 8px; }
.deck {
  display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 10px 12px; width: 100%;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; transition: transform .08s, box-shadow .08s;
}
.deck[aria-pressed="true"] { background: var(--mint-soft); box-shadow: var(--shadow); }
.deck .nm { font-family: var(--font-display); font-size: 17px; }
.deck .cnt { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; align-self: center; }
.deck .note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 10px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); display: flex; overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; }
.bar .m { background: var(--pink); }
.bar .l { background: var(--yellow); }
.barkey { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.barkey span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; border: 1.5px solid var(--line); vertical-align: -1px; }
.barkey .km::before { background: var(--pink); }
.barkey .kl::before { background: var(--yellow); }
.barkey .kn::before { background: var(--surface); }
.set { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
.seg { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex: none; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13.5px; color: var(--muted); font-family: var(--font-display); }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--yellow); color: #2a2340; }
.switch { width: 46px; height: 26px; border-radius: 999px; border: 2px solid var(--line); background: var(--soft); position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); box-sizing: border-box; transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.legend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend b { font-family: var(--font-py); font-size: 15px; font-weight: 700; margin-right: 3px; }
.lg1 { color: var(--t1); } .lg2 { color: var(--t2); } .lg3 { color: var(--t3); } .lg4 { color: var(--t4); } .lg5 { color: var(--t5); }
body.notone .legend { opacity: .45; }
.note-s { font-size: 12px; color: var(--muted); margin: 0; }
.sync { font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; margin: 0; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid var(--line); background: var(--hair); flex: none; transform: translateY(-1px); }
.sync.ok::before { background: var(--mint); }
.reset { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.link { border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }
.link.danger { color: var(--bad); }
.link.strong { color: var(--ink); font-family: var(--font-display); font-size: 14.5px; }

/* 좁은 화면 위쪽 급수 바 */
.mbar { display: none; }
.mbar .seg { flex: 1; box-shadow: var(--shadow); }
.mbar .seg button { flex: 1; padding: 8px 6px; font-size: 15px; }
.mbar .mstat { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 퀴즈 */
.qbar { height: 12px; border: 2px solid var(--line); border-radius: 6px; background: var(--surface); flex-basis: 100%; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--mint); transition: width .3s; }
.prompt { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 170px; }
.cloze { font-family: var(--font-han); font-size: clamp(20px, 3vw, 24px); line-height: 1.7; text-align: center; margin: 0; max-width: 30em; }
.cloze .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--pink); margin: 0 3px; text-align: center; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  border: 2px solid var(--line); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 11px 14px;
  text-align: left; display: flex; gap: 12px; align-items: center; min-height: 60px; transition: transform .08s, box-shadow .08s;
}
.opt .k { font-family: var(--font-pixel); font-size: 11px; border: 2px solid var(--line); border-radius: 7px; width: 24px; height: 24px; display: grid; place-items: center; flex: none; background: var(--soft); }
.opt .v { min-width: 0; }
.opt.han .v { font-family: var(--font-han); font-size: 25px; line-height: 1.2; }
.opt.pyo .v { font-family: var(--font-py); font-size: 18px; font-weight: 500; }
.opt.right { background: var(--mint); color: #2a2340; }
.opt.wrong { background: var(--pink); color: #2a2340; }
.opt.right :is(.t1, .t2, .t3, .t4, .t5), .opt.wrong :is(.t1, .t2, .t3, .t4, .t5) { color: #2a2340; }
.opt.dim { opacity: .5; box-shadow: none; }
.fb { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; border-top: 2px dashed var(--hair); padding-top: 16px; }
.verdict { font-family: var(--font-display); font-size: 18px; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.fbw { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fbw .h { font-family: var(--font-han); font-size: 22px; }
.fbw .p { font-family: var(--font-py); font-weight: 700; }
.fb .btn { margin-left: auto; }
.types { display: flex; gap: 8px; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-size: 62px; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 26px; color: var(--muted); }
.missed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; width: 100%; }
.missed li { display: flex; gap: 12px; align-items: baseline; padding: 8px 14px; background: var(--soft); border: 2px solid var(--hair); border-radius: 14px; flex-wrap: wrap; }
.missed .h { font-family: var(--font-han); font-size: 20px; }
.missed .p { font-family: var(--font-py); font-size: 14px; font-weight: 700; }
.missed .m { color: var(--muted); font-size: 14px; }

/* 단어 목록 */
.listv { display: grid; gap: 12px; }
.lhead { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lhead input { flex: 1; min-width: 200px; padding: 11px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; box-shadow: var(--shadow); }
.lhead input:focus { outline: 3px solid var(--pink); outline-offset: 1px; }
.lcount { margin: 0; font-size: 13px; color: var(--muted); }
.words { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-l); overflow: hidden; }
.words > li + li { border-top: 2px dashed var(--hair); }
.wrow { display: flex; align-items: center; gap: 8px; padding-right: 12px; }
.wmain { flex: 1; min-width: 0; display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 0 14px; align-items: center; text-align: left; border: 0; background: transparent; padding: 11px 16px; }
.wmain:hover { background: var(--soft); }
.whz { grid-row: span 3; font-family: var(--font-han); font-size: 26px; font-weight: 500; line-height: 1.2; }
.whz sup { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.wpy { font-family: var(--font-py); font-size: 14.5px; font-weight: 700; }
.wm { font-size: 14px; color: var(--muted); }
.wex { font-family: var(--font-han); font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wst { grid-row: 1 / span 3; grid-column: 3; }
.wx { padding: 2px 16px 16px 134px; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; margin: 0; }
.more { display: flex; justify-content: center; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .mbar { display: flex; align-items: center; gap: 12px; }
}
@media (max-width: 560px) {
  .app { padding-top: 14px; gap: 14px; }
  .top { gap: 12px; }
  .brand h1 { font-size: 23px; }
  .logo { width: 46px; height: 46px; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding: 7px 6px; font-size: 15px; }
  .pet { grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 10px 12px 10px 10px; border-radius: 20px; }
  .pet-screen { width: 112px; height: 92px; border-radius: 14px; }
  .pet-screen canvas { width: 100px; height: 80px; }
  .bubble { font-size: 14px; padding: 5px 10px; }
  .pet-name { font-size: 16px; }
  .xp i { height: 8px; }
  .card { min-height: 0; gap: 16px; border-radius: 22px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .cta, .rate { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 3; }
  .rate { background: var(--surface); padding: 8px 0 2px; margin-top: -8px; border-radius: 16px; }
  .rate button { padding: 12px 6px; }
  .lhead input { font-size: 16px; }
  .wmain { grid-template-columns: 72px minmax(0, 1fr) auto; gap: 0 10px; padding: 10px 12px; }
  .whz { font-size: 21px; }
  .wx { padding: 2px 14px 14px; }
  .rate small { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* 영어 카드: 줄 공책 */
.enframe {
  width: min(100%, 440px); position: relative; border: 2px solid var(--grid); border-radius: 14px;
  background-color: var(--surface);
  background-image: repeating-linear-gradient(transparent 0 31px, var(--hair) 31px 33px);
  padding: 30px 22px 26px 50px; text-align: center; display: grid; gap: 6px;
}
.enframe::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; border-left: 2px solid var(--grid); }
.enw { font-family: var(--font-en); font-size: clamp(36px, 7vw, 56px); line-height: 1.1; overflow-wrap: anywhere; margin: 0; }
.enframe .pos { justify-self: center; }
.reveal .enw { animation: rise .35s ease both; }
.ex-en { font-family: var(--font-en); font-size: 19px; margin: 0; line-height: 1.5; }
.ex-en mark, .cloze mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; box-shadow: inset 0 -2px 0 var(--pink); }
.cloze.en { font-family: var(--font-en); }
.opt.enopt .v { font-family: var(--font-en); font-size: 22px; line-height: 1.2; }
.wen { grid-row: span 3; font-family: var(--font-en); font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
.wex.en { font-family: var(--font-en); }

/* 커플 */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.who { background: var(--soft); border: 2px solid var(--hair); border-radius: 14px; padding: 6px 10px; display: grid; gap: 1px; min-width: 0; }
.who.on { background: var(--mint-soft); border-color: var(--line); }
.who .nm { font-family: var(--font-display); font-size: 15px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.who .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .lang { font-size: 11.5px; color: var(--muted); }
.who .today { font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.who .hearts svg { width: 12px; height: 11px; }
.who.empty { border-style: dashed; color: var(--muted); font-size: 12.5px; place-content: center; text-align: center; }
.cstreak { font-family: var(--font-display); font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
.cstreak svg { width: 15px; height: 13px; }
.pet-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn.small { padding: 5px 12px; font-size: 14.5px; border-radius: 12px; box-shadow: 2px 2px 0 var(--line); }
.btn.small.pink { background: var(--pink); color: #2a2340; }
.btn.small.yellow { background: var(--yellow); color: #2a2340; }
.btn.small:disabled { opacity: .5; box-shadow: none; }
.cheerform { display: flex; gap: 8px; width: 100%; }
.cheerform input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
.cheerform input:focus { outline: 3px solid var(--pink); outline-offset: 1px; }
.invite-help { font-size: 12.5px; color: var(--muted); margin: 0; background: var(--soft); border-radius: 12px; padding: 8px 10px; }
.banner {
  display: flex; gap: 12px; align-items: center; background: var(--pink-soft); border: 2px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); padding: 10px 14px; font-family: var(--font-display); font-size: 16px; animation: rise .35s ease both;
}
.banner svg { width: 22px; height: 19px; flex: none; }
.banner .x { margin-left: auto; }
.nickrow { display: flex; gap: 8px; align-items: center; }
.nickrow input { flex: 1; min-width: 0; border: 2px solid var(--line); border-radius: 10px; padding: 5px 10px; font: inherit; font-size: 15px; background: var(--surface); color: var(--ink); }

/* 처음 고르기 */
.pickwrap { display: grid; gap: 16px; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pickbtn {
  border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-l); padding: 20px; text-align: left; display: grid; gap: 6px;
  transition: transform .08s, box-shadow .08s; color: #2a2340;
}
.pickbtn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--line); }
.pickbtn.zh { background: var(--yellow-soft); } .pickbtn.en { background: var(--mint-soft); }
:root[data-theme="dark"] .pickbtn, .pickbtn { color: var(--ink); }
.pickbtn .big { font-family: var(--font-han); font-size: 44px; line-height: 1.1; }
.pickbtn.en .big { font-family: var(--font-en); }
.pickbtn b { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.pickbtn span { font-size: 13.5px; color: var(--muted); }

@media (max-width: 560px) {
  .pick { grid-template-columns: minmax(0, 1fr); }
  .duo { gap: 6px; }
  .who { padding: 5px 8px; }
  .who .nm { font-size: 14px; }
  .who .lang { display: none; }
  .pet-actions .cstreak { width: 100%; }
}

/* 꾸미기 */
.btn.small.mint { background: var(--mint); color: #2a2340; }
.btn.small.dot { position: relative; }
.btn.small.dot::after { content: ""; position: absolute; top: -5px; right: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--pink); border: 2px solid var(--line); }
.closet { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px 16px; display: grid; gap: 12px; }
.closet-head { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.closet-head h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19px; }
.closet-head .hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.closet-head .btn { margin-left: auto; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.item { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 6px 9px; background: var(--soft); border: 2px solid var(--hair); border-radius: 14px; color: var(--ink); font: inherit; }
.item .mini { position: relative; display: block; width: 76px; height: 60px; border-radius: 10px; overflow: hidden; background: var(--screen) linear-gradient(transparent 76%, rgba(114, 217, 186, .35) 76%); }
.item .sc-anim { animation: none !important; }
.item b { font-family: var(--font-display); font-weight: 400; font-size: 14px; }
.item small { font-size: 11.5px; color: var(--muted); }
.item.on { background: var(--mint-soft); border-color: var(--line); box-shadow: 2px 2px 0 var(--line); }
.item.locked .mini { filter: grayscale(1); opacity: .4; }
.item:not(.locked):hover { border-color: var(--line); }
.newb { position: absolute; top: -8px; right: -6px; font-style: normal; font-family: var(--font-pixel); font-size: 10px; background: var(--pink); color: #2a2340; border: 2px solid var(--line); border-radius: 6px; padding: 1px 4px; }

/* 퀴즈 내기 */
.qsend { display: grid; gap: 6px; background: var(--soft); border: 2px solid var(--hair); border-radius: 14px; padding: 8px 10px; width: 100%; }
.qsend p { margin: 0; font-size: 13px; color: var(--muted); }
.qsend ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.qsend li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; min-width: 0; }
.qsend .h { font-family: var(--font-han); font-size: 16px; flex: none; }
.qsend .h[lang="en"] { font-family: var(--font-en); }
.qsend .m { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qsend .row { display: flex; gap: 6px; flex-wrap: wrap; }
.pq { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--pink-soft); border: 2px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 14px; font-family: var(--font-display); font-size: 15px; }
.pq svg { width: 18px; height: 16px; flex: none; }
.pq .btn { margin-left: auto; }
.chip.pink { background: var(--pink-soft); }

/* 문법 */
.gdet { display: grid; gap: 10px; }
.gpat { margin: 0; font-family: var(--font-han), var(--font-display); font-size: 26px; line-height: 1.35; word-break: keep-all; }
.gpat:not([lang]) { font-family: var(--font-display); }
.gko { margin: 0; font-family: var(--font-display); font-size: 18px; }
.gnote { margin: 0; color: var(--muted); line-height: 1.65; }
.card.gram { min-height: 0; }
.card.gram .prompt { min-height: 140px; }
.gfb { font-family: var(--font-han), var(--font-display); font-weight: 500; font-size: 17px; }
.gfb:not([lang]) { font-family: var(--font-display); font-weight: 400; }
.glistv { margin-top: 6px; }
.gh { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; flex: 1; }
.gh small { font-family: var(--font-body); font-size: 13px; color: var(--muted); margin-left: 6px; }
.gcat { margin: 6px 4px -4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.gmain { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; }
.gmain .gp { grid-column: 1; grid-row: 1; font-family: var(--font-han), var(--font-display); font-size: 17px; min-width: 0; word-break: keep-all; }
.gmain .gp:not([lang]) { font-family: var(--font-display); }
.gmain .wm { grid-column: 1; grid-row: 2; }
.gmain .wst { grid-column: 2; grid-row: 1 / span 2; }
.glistv .wx { padding: 2px 16px 16px; }
@media (max-width: 560px) {
  .items { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .item .mini { width: 64px; height: 52px; }
  .gpat { font-size: 21px; }
  .gmain { padding: 10px 12px; }
  .pet-actions .btn.small { padding-left: 9px; padding-right: 9px; }
}
.pet-row .xp { flex: 1 1 120px; }
.set > label { flex: none; }
.set .nickrow { flex: 0 1 170px; }

/* 수찬이 그림 */
.pet-screen { position: relative; overflow: hidden; }
.sc { position: absolute; inset: 0; }
.sc-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sc-body { position: absolute; left: 50%; bottom: 2%; height: 98%; aspect-ratio: 1 / 1; transform: translateX(-50%) scale(var(--s)); transform-origin: 50% 100%; }
.sc-anim { position: absolute; inset: 0; transform-origin: 50% 100%; }
.sc-anim img, .sc-anim svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sc-wear { overflow: visible; }
.sc-anim img { user-select: none; -webkit-user-select: none; -webkit-user-drag: none; pointer-events: none; }
.sc-shadow { position: absolute; left: 22%; right: 22%; bottom: -1.5%; height: 6%; border-radius: 50%; background: rgba(42, 35, 64, .16); }
.m-idle .sc-anim { animation: sc-breathe 3.2s ease-in-out infinite; }
.m-happy .sc-anim { animation: sc-hop .55s ease-in-out infinite; }
.m-sad .sc-anim { animation: sc-sway 2.4s ease-in-out infinite; }
.m-eat .sc-anim { animation: sc-munch .7s ease-in-out infinite; }
@keyframes sc-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
@keyframes sc-hop { 0%, 100% { transform: translateY(0) scale(1.02, .98); } 50% { transform: translateY(-7%) scale(.98, 1.02); } }
@keyframes sc-sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes sc-munch { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
.sc-bg .tw { animation: sc-tw 2.4s ease-in-out infinite; }
@keyframes sc-tw { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.sc-bg .pt { animation: sc-fall 6s linear infinite; }
@keyframes sc-fall { from { transform: translate(0, -12px) rotate(0deg); } to { transform: translate(16px, 150px) rotate(300deg); } }
.sc-bg .wv { animation: sc-wave 3s ease-in-out infinite; }
@keyframes sc-wave { 50% { transform: translateX(-8px); } }
.logo { position: relative; overflow: hidden; }
.logo img { position: absolute; width: 176%; left: -71%; top: -2%; max-width: none; }
@media (prefers-reduced-motion: reduce) { .sc-anim, .sc-bg * { animation: none !important; } }

/* 커플 그림 */
.who .nm .av { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); object-fit: cover; flex: none; background: var(--screen); }
.couple-card { display: grid; gap: 8px; justify-items: center; }
.couple-card img { width: 100%; max-width: 270px; height: auto; display: block; }
.cnames { margin: 0; font-family: var(--font-display); font-size: 19px; }
.cnames span { color: var(--pink); }
.cstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.cstats span { background: var(--soft); border-radius: 12px; padding: 7px 4px; text-align: center; display: grid; gap: 1px; }
.cstats b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.cstats b.sm { font-size: 14.5px; line-height: 1.5; }
.cstats small { color: var(--muted); font-size: 11.5px; }
.pick-hero { display: block; width: min(300px, 78%); height: auto; margin: 0 auto; }
.sc-wear .twk { animation: sc-tw 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@media (max-width: 560px) { .who .nm .av { width: 20px; height: 20px; } }

/* ===== 새 디자인: 민트·크림 파스텔, 얇은 민트 테두리, 부드러운 그림자, 아래 탭 바 ===== */
:root {
  --paper: #f8f5ea; --surface: #ffffff; --ink: #26302c; --muted: #75817b;
  --line: #d3eadf; --hair: #e8f0eb; --soft: #f3f8f5;
  --pink: #f4a8b4; --pink-soft: #fde8ec; --pink-line: #f5c6cf; --pink-k: #e07d8f;
  --yellow: #f2d78f; --yellow-soft: #fbf3dc; --yellow-line: #eedfa8; --yellow-k: #c4a14a;
  --mint: #82d4b2; --mint-soft: #e3f5ec; --mint-line: #bfe6d3; --mint-k: #3fae86; --mint-deep: #3fae86;
  --lav: #c8bff2; --lav-soft: #eeebfd; --lav-line: #d6cef7; --lav-k: #8b7ddb;
  --screen: #fbf7ea; --grid: transparent; --mark: rgba(130, 212, 178, .38);
  --shadow: 0 2px 10px rgba(52, 104, 82, .08); --shadow-l: 0 6px 22px rgba(52, 104, 82, .1);
  --font-display: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-han: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-en: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-py: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --good: #2f9e74; --bad: #d9667a; --tabh: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161d1a; --surface: #202925; --ink: #e9f0ec; --muted: #9db0a6; --line: #33453c; --hair: #2b3832; --soft: #26312c;
    --pink-soft: #45282f; --pink-line: #6a3a45; --yellow-soft: #3e3520; --yellow-line: #5e4f2a; --mint-soft: #1d3a2f; --mint-line: #2f5d4a;
    --lav-soft: #2e2a48; --lav-line: #463f6e; --screen: #262b21; --mark: rgba(130, 212, 178, .25);
    --shadow: none; --shadow-l: none; color-scheme: dark;
  }
}
body { background-image: none; font-size: 15px; }
:focus-visible { outline: 3px solid var(--mint-deep); outline-offset: 2px; }
.app { max-width: 540px; display: block; padding: 0 16px calc(var(--tabh) + 30px + env(safe-area-inset-bottom)); }
main { gap: 14px; }
kbd { font-family: var(--font-py); font-size: 10px; }

/* 머리말 */
.hd { margin: 0 -16px 14px; padding: calc(18px + env(safe-area-inset-top)) 18px 16px; background: var(--mint-soft); border-radius: 0 0 26px 26px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.hd-title { display: flex; align-items: center; gap: 8px; }
.hd h1 { margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .7); color: var(--ink); padding: 0; flex: none; }
.iconbtn .ic { width: 20px; height: 20px; }
.hd-lv { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.lvbadge { width: 26px; height: 29px; display: grid; place-items: center; background: #ffd77a; color: #6b4a00; font-weight: 800; font-size: 13.5px;
  clip-path: polygon(50% 0, 100% 16%, 100% 68%, 50% 100%, 0 68%, 0 16%); flex: none; }
.lvname { font-weight: 700; white-space: nowrap; }
.xpnum { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.xpbar { height: 10px; border-radius: 99px; background: var(--surface); margin-top: 6px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--mint-line); }
.xpbar i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .4s; }
.hd .bubble { margin: 10px 0 0; max-width: none; justify-self: stretch; background: var(--surface); border: 0; box-shadow: var(--shadow); border-radius: 14px;
  padding: 7px 12px; font-family: var(--font-body); font-size: 13.5px; font-weight: 500; line-height: 1.4; }
.hd .bubble::before { left: auto; right: -6px; top: 50%; margin-top: -6px; width: 12px; height: 12px; background: var(--surface); border: 0; transform: rotate(45deg); }
.hd-r { align-self: end; }
.petbtn { position: relative; display: block; width: 118px; height: 106px; border: 0; padding: 0; background: transparent; border-radius: 20px; }
.petbtn .sc { border-radius: 20px; overflow: hidden; }
.dress { position: absolute; left: -6px; bottom: -4px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow);
  display: grid; place-items: center; color: var(--mint-k); }
.dress .ic { width: 17px; height: 17px; }
.dress.dot::after { content: ""; position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: #ff7d96; border: 2px solid var(--surface); }

/* 카드 공통 */
.card { border: 2px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; gap: 14px; min-height: 0; }
.panel { border: 2px solid var(--line); box-shadow: var(--shadow); border-radius: 20px; }
.panel h3, .done h2, .quiz h2 { font-family: var(--font-body); font-weight: 800; }
.panel h3 { font-size: 16px; }
.chip { border: 0; background: var(--mint-soft); font-weight: 700; font-size: 12px; padding: 3px 10px; }
.chip.pink { background: var(--pink-soft); }
.st-new { border-color: var(--line); }
.remain { font-family: var(--font-body); font-weight: 700; font-size: 13.5px; }
.btn { border: 1.5px solid var(--line); box-shadow: none; font-family: var(--font-body); font-weight: 700; font-size: 16px; border-radius: 16px; }
.btn:active, .rate button:active, .opt:not(:disabled):active, .deck:active { transform: scale(.98); box-shadow: none; }
.btn.primary { background: var(--mint); border-color: var(--mint); color: #143a2b; }
.btn.small { box-shadow: none; font-size: 13.5px; }
.link { font-family: var(--font-body); }
.seg { border: 1.5px solid var(--line); border-radius: 12px; }
.seg button { font-family: var(--font-body); font-weight: 500; font-size: 13px; padding: 5px 11px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--mint-soft); color: var(--ink); font-weight: 700; }
.switch { border-color: var(--line); }
.spk { border: 1.5px solid var(--line); box-shadow: none; }
.banner { border: 0; box-shadow: var(--shadow); font-family: var(--font-body); font-weight: 700; font-size: 14.5px; }
.banner svg { width: 18px; height: 16px; }
.deck { border: 1.5px solid var(--line); box-shadow: none; border-radius: 16px; }
.deck[aria-pressed="true"] { background: var(--mint-soft); box-shadow: none; border-color: var(--mint-line); }
.deck .nm { font-family: var(--font-body); font-weight: 700; font-size: 15px; }
.bar { border: 0; background: var(--soft); }
.stats div { border-radius: 14px; }

/* 둘의 오늘 */
.cc { padding: 14px; gap: 12px; }
.pchips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pchip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--pink-soft); min-width: 0; }
.pchip.lav { background: var(--lav-soft); }
.pchip .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface); }
.pchip .pt { display: grid; min-width: 0; line-height: 1.3; }
.pchip .pn { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip .pv { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pchip.on .pv { color: var(--ink); font-weight: 700; }
.pchip.empty { background: var(--soft); color: var(--muted); font-size: 12.5px; justify-content: center; border: 1.5px dashed var(--line); padding: 5px 10px; }
.cc-row { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.medal { width: 34px; height: 34px; border-radius: 50%; background: #ffe39a; box-shadow: inset 0 0 0 2.5px #f1c255; display: grid; place-items: center;
  font-weight: 800; font-size: 14.5px; color: #6b4a00; flex: none; }
.cc-txt { font-size: 13.5px; font-weight: 700; flex: 1 1 auto; min-width: 0; line-height: 1.35; }
.cc-act { margin-left: auto; display: flex; gap: 6px; flex: none; }
.mini-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; }
.mini-btn:disabled { opacity: .45; }
.deckbar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.deckbar .mstat { font-size: 12.5px; color: var(--muted); }

/* 학습 카드 */
.stage { min-height: 190px; gap: 14px; }
.tzg { gap: 2px; }
.cw { flex-direction: column-reverse; gap: 2px; }
.cw + .cw .cell, .cell { border: 0; background: none; width: auto; height: auto; border-radius: 0 !important; }
.cell::before, .cell::after { display: none; }
.hz { font-weight: 700; font-size: var(--hzs); line-height: 1.12; }
.tzg.n1 { --hzs: clamp(76px, 22vw, 104px); } .tzg.n2 { --hzs: clamp(68px, 19vw, 92px); }
.tzg.n3 { --hzs: clamp(54px, 15vw, 76px); } .tzg.n4 { --hzs: clamp(44px, 12vw, 62px); }
.py { font-family: var(--font-py); font-weight: 500; font-size: 18px; }
.enframe { border: 0; background: none; padding: 8px 0; width: auto; }
.enframe::before { display: none; }
.enw { font-family: var(--font-en); font-weight: 700; font-size: clamp(38px, 10vw, 54px); letter-spacing: -.01em; }
.mean-big, .meaning { font-family: var(--font-body); font-weight: 800; }
.meaning { font-size: 24px; }
.back { border-top: 1.5px dashed var(--line); }
.ex { background: var(--soft); border: 0; border-radius: 16px; }
.ex.wait { border: 1.5px dashed var(--line); }
.ex-head { font-family: var(--font-body); font-weight: 700; font-size: 12.5px; }
.ex-zh { font-weight: 500; }
.ex-zh mark, .ex-en mark, .cloze mark { background: var(--mark); box-shadow: none; }
.ex-en { font-family: var(--font-en); font-size: 18px; }
.rate { gap: 10px; }
.rate button { border: 2px solid transparent; box-shadow: none; border-radius: 18px; padding: 11px 6px; font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--ink); }
.rate button[data-r="0"] { background: var(--pink-soft); border-color: var(--pink-line); }
.rate button[data-r="1"] { background: var(--yellow-soft); border-color: var(--yellow-line); }
.rate button[data-r="2"] { background: var(--mint-soft); border-color: var(--mint-line); }
.stamp { border: 0; background: var(--mint-soft); color: var(--mint-k); box-shadow: none; border-radius: 22px; font-family: var(--font-han); }
.done h2 { font-size: 24px; }

/* 퀴즈·문법 보기: 2×2 색 타일 */
.qbar { height: 10px; border: 0; border-radius: 99px; background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--line); }
.qbar i { border-radius: 99px; }
.opts { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 12px; }
.opt { position: relative; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; min-height: 112px;
  border-radius: 20px; border: 2px solid var(--line); box-shadow: none; padding: 14px 10px; color: var(--ink); }
.opts .opt:nth-child(1) { background: var(--pink-soft); border-color: var(--pink-line); --kc: var(--pink-k); }
.opts .opt:nth-child(2) { background: var(--mint-soft); border-color: var(--mint-line); --kc: var(--mint-k); }
.opts .opt:nth-child(3) { background: var(--yellow-soft); border-color: var(--yellow-line); --kc: var(--yellow-k); }
.opts .opt:nth-child(4) { background: var(--lav-soft); border-color: var(--lav-line); --kc: var(--lav-k); }
.opt .k { border: 0; background: none; width: auto; height: auto; font-family: var(--font-en); font-weight: 800; font-size: 32px; line-height: 1; color: var(--kc); }
.opt .v { font-size: 15px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.opt.han .v { font-size: 26px; font-weight: 600; }
.opt.enopt .v { font-family: var(--font-en); font-size: 18px; }
.opt.pyo .v { font-size: 17px; }
.opt.right { border-color: var(--mint-deep) !important; box-shadow: 0 0 0 3px rgba(63, 174, 134, .22); }
.opt.wrong { border-color: var(--bad) !important; }
.opt.dim { opacity: .45; }
.okmark { position: absolute; top: -9px; right: -9px; width: 30px; height: 30px; border-radius: 50%; background: var(--mint-deep); color: #fff;
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.okmark .ic { width: 18px; height: 18px; stroke-width: 3; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: 30%; left: 50%; width: 7px; height: 9px; border-radius: 2px; animation: cf .9s ease-out forwards; }
.confetti i:nth-child(1) { background: #ff8fa3; --dx: -46px; --dy: -42px; } .confetti i:nth-child(2) { background: #82d4b2; --dx: 40px; --dy: -48px; }
.confetti i:nth-child(3) { background: #f2c94c; --dx: -58px; --dy: 4px; } .confetti i:nth-child(4) { background: #a99bf0; --dx: 56px; --dy: -6px; }
.confetti i:nth-child(5) { background: #6bb8ff; --dx: -24px; --dy: -62px; } .confetti i:nth-child(6) { background: #ffb35c; --dx: 26px; --dy: -64px; }
@keyframes cf { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(220deg); opacity: 0; } }
.verdict { font-family: var(--font-body); font-weight: 800; }
.cloze { font-weight: 500; }
.cloze .gap { border-bottom-color: var(--mint-deep); }
.prompt h2 { font-size: 24px; }
.score { font-family: var(--font-body); font-weight: 800; }
.missed li { border: 1.5px solid var(--line); background: var(--surface); }
.pq { border: 0; box-shadow: var(--shadow); font-family: var(--font-body); font-weight: 700; font-size: 14.5px; }

/* 문법 */
.gram .opt .k { position: absolute; top: 10px; left: 13px; font-size: 15px; }
.gram .opt .v { font-size: 20px; }
.gram .opt.han .v { font-size: 26px; }
.gpat { background: var(--mint-soft); border-radius: 14px; padding: 10px 14px; font-family: var(--font-han), var(--font-body); font-weight: 700; font-size: 20px; }
.gpat:not([lang]) { font-family: var(--font-body); }
.gko { font-family: var(--font-body); font-weight: 700; font-size: 16px; }
.gnote { font-size: 14px; }
.gh { font-family: var(--font-body); font-weight: 800; font-size: 18px; }
.gfb { font-family: var(--font-han), var(--font-body); font-weight: 700; }
.gfb:not([lang]) { font-family: var(--font-body); }
.gmain .gp { font-family: var(--font-han), var(--font-body); font-weight: 600; }
.gmain .gp:not([lang]) { font-family: var(--font-body); }

/* 단어 목록 */
.words { border: 2px solid var(--line); box-shadow: var(--shadow); }
.words > li + li { border-top: 1.5px solid var(--hair); }
.whz { font-weight: 600; }
.lhead input { border: 1.5px solid var(--line); box-shadow: none; }
.lhead input:focus { outline-color: var(--mint-deep); }

/* 우리 둘 카드 */
.us { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 16px; }
.us img { width: min(280px, 90%); height: auto; display: block; }
.cnames { margin: 0; font-family: var(--font-body); font-weight: 800; font-size: 18px; }
.cnames span { color: #ff7d96; }
.cstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.cstats span { background: var(--soft); border-radius: 14px; padding: 8px 4px; display: grid; gap: 1px; }
.cstats b { font-family: var(--font-body); font-weight: 800; font-size: 17px; }
.cstats b.sm { font-size: 14px; line-height: 1.55; }
.cstats small { color: var(--muted); font-size: 11.5px; }

/* 처음 화면 */
.pickwrap h2 { font-family: var(--font-body) !important; font-weight: 800 !important; font-size: 24px !important; }
.pickbtn { border: 2px solid var(--line); box-shadow: var(--shadow); border-radius: 22px; color: var(--ink); }
.pickbtn:active { transform: scale(.98); box-shadow: none; }
.pickbtn.zh { background: var(--pink-soft); border-color: var(--pink-line); } .pickbtn.en { background: var(--lav-soft); border-color: var(--lav-line); }
.pickbtn b { font-family: var(--font-body); font-weight: 800; font-size: 19px; }
.pickbtn .big { font-weight: 700; }
.pick-hero { width: min(280px, 76%); }

/* 아래 탭 바 */
.tabbar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: 0; width: min(540px, 100%); display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 4px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1.5px solid var(--line); box-shadow: 0 -4px 18px rgba(52, 104, 82, .06); }
.tabbar button { border: 0; background: transparent; border-radius: 14px; padding: 6px 0 4px; display: grid; justify-items: center; gap: 1px; color: var(--muted); font-size: 12px; font-weight: 700; }
.tabbar .ic { width: 24px; height: 24px; }
.tabbar button[aria-selected="true"] { background: var(--mint-soft); color: var(--ink); }
body.picking .tabbar { display: none; }
@media (min-width: 600px) {
  .tabbar { bottom: 14px; width: min(520px, calc(100% - 28px)); border: 1.5px solid var(--line); border-radius: 22px; }
  .hd { margin-top: 14px; border-radius: 26px; }
}

/* 아래에서 올라오는 시트 */
.sheet { position: fixed; inset: 0; z-index: 40; }
.sheet-bg { position: absolute; inset: 0; background: rgba(28, 40, 34, .38); animation: sheet-fade .2s ease both; }
.sheet-card { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(540px, 100%); max-height: 86vh; overflow: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 24px 24px 0 0; padding: 0 16px calc(22px + env(safe-area-inset-bottom)); animation: sheet-up .26s ease-out both; }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; padding: 16px 0 10px; background: var(--paper); }
.sheet-head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.sheet-head .iconbtn { margin-left: auto; background: var(--surface); border: 1.5px solid var(--line); }
.sheet-body { display: grid; gap: 12px; }
.sheet-body > .hint { margin: 0; text-align: left; }
body.sheet-open { overflow: hidden; }
@keyframes sheet-up { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes sheet-fade { from { opacity: 0; } }
.cheerform { display: grid; gap: 10px; }
.cheerform label { font-weight: 700; font-size: 14px; }
.cheerform input { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
.cheerform input:focus { outline: 3px solid var(--mint-deep); }
.qsend { background: var(--surface); border: 1.5px solid var(--line); padding: 12px 14px; gap: 10px; }
.qsend p { font-size: 13.5px; }
.qsend .h { font-size: 18px; }
.invite-help { margin: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }
.items { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.item { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; }
.item b { font-family: var(--font-body); font-weight: 700; font-size: 13.5px; }
.item.on { background: var(--mint-soft); border-color: var(--mint-deep); box-shadow: none; }
.item .mini { width: 100%; max-width: 92px; height: 72px; }
.newb { font-family: var(--font-py); font-weight: 800; color: #fff; background: #ff7d96; border: 0; }

@media (max-width: 560px) {
  .hd h1 { font-size: 24px; }
  .petbtn { width: 104px; height: 96px; }
  .cta, .rate { bottom: calc(var(--tabh) + 12px + env(safe-area-inset-bottom)); }
  .rate { background: var(--surface); box-shadow: 0 14px 0 0 var(--surface), 0 -12px 14px -4px var(--surface); }
  .cta { box-shadow: 0 14px 0 0 var(--surface), 0 -12px 14px -4px var(--surface); }
  .opt { min-height: 100px; }
  .opt .k { font-size: 28px; }
  .card { padding: 16px; }
}
.pickbtn.zh .big { color: var(--pink-k); } .pickbtn.en .big { color: var(--lav-k); }

/* ===== 단어 게임: 수찬이 먹이 주기 ===== */
body.gaming .hd, body.gaming .tabbar { display: none; }
body.gaming .app { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.gcard { gap: 12px; }
.gcard-top { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; }
.gcard-top h2 { margin: 0; font-size: 21px; font-weight: 800; }
.gcard-top .lead { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.gcard-pet { position: relative; width: 96px; height: 86px; border-radius: 18px; background: var(--mint-soft); overflow: hidden; }
.gcard-pet .sc-anim { animation: none !important; }
.g-rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.g-rules li { background: var(--soft); border-radius: 12px; padding: 7px 12px; font-size: 13.5px; }
.g-rules b { color: var(--mint-k); margin-right: 4px; }
.gb-h { margin: 4px 0 0; font-size: 14px; font-weight: 800; }
.gboard { display: grid; gap: 6px; width: 100%; }
.gb-row { display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.gb-row .av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--soft); }
.gb-n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gb-bar { height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--line); }
.gb-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), #f2c94c); border-radius: 99px; }
.gb-row b { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

.game { display: grid; gap: 10px; }
.game.shake { animation: g-shake .4s; }
@keyframes g-shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.g-top { display: flex; align-items: center; gap: 10px; }
.g-top .iconbtn { background: var(--surface); border: 1.5px solid var(--line); }
.g-hearts { display: flex; gap: 4px; }
.g-heart svg { width: 24px; height: 21px; display: block; }
.g-heart.lost { opacity: .5; }
.g-score { margin-left: auto; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.g-sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 26px; }
.g-sub span { border-radius: 99px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; background: var(--soft); color: var(--muted); }
.g-combo.on { background: var(--mint-soft); color: var(--mint-k); }
.g-fever { background: linear-gradient(90deg, #ffd1dc, #ffe9a3) !important; color: #b5476a !important; animation: g-pulse .6s ease-in-out infinite alternate; }
.g-goldtag { background: #fff0bf !important; color: #9a7316 !important; }
@keyframes g-pulse { to { transform: scale(1.06); } }
.g-timer { height: 10px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
.g-timer i { display: block; height: 100%; background: var(--mint); border-radius: 99px; }
